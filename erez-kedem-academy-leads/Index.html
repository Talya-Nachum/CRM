<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <header class="hub">
    <div class="logo-mark">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 4 L34 20 H29 L37 32 H30 L36 42 H12 L18 32 H11 L19 20 H14 Z" fill="#ffffff"/>
        <rect x="21.5" y="42" width="5" height="4" fill="#ffffff"/>
      </svg>
      <div class="logo-text">
        <span class="word">KEDEM · האקדמיה הפרקטית לביטוח</span>
        <span class="tag">ניהול לידים — ארז קדם אקדמיה</span>
      </div>
    </div>

    <div class="countdown">
      <span class="cd-label">עד תחילת האקדמיה</span>
      <div class="cd-units">
        <div class="cd-unit"><span class="n" id="cdDays">--</span><span class="u">ימים</span></div>
        <div class="cd-unit"><span class="n" id="cdHours">--</span><span class="u">שעות</span></div>
        <div class="cd-unit"><span class="n" id="cdMins">--</span><span class="u">דקות</span></div>
      </div>
    </div>

    <div class="hub-actions">
      <button class="hub-btn gold" id="paymentBtn">מעבר לתשלום</button>
      <button class="hub-btn ghost" id="infoBtn">מידע על האקדמיה</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="searchInput" class="search-input" type="text" placeholder="חיפוש לפי שם, חברה, טלפון או אימייל...">
      <select id="statusFilter" class="status-filter">
        <option value="">כל הסטטוסים</option>
      </select>
      <button class="btn btn-wa" id="waBtn" disabled>💬 שליחת וואטסאפ (<span id="selCount">0</span>)</button>
      <button class="btn btn-primary" id="addLeadBtn">+ הוספת ליד</button>
      <div class="count-pill" id="leadCount"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>מקור</th>
            <th>שם חברה</th>
            <th>ח.פ</th>
            <th>איש קשר</th>
            <th>תפקיד</th>
            <th>נייד</th>
            <th>אימייל</th>
            <th>הערות</th>
            <th>סטטוס</th>
            <th>עודכן</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr><td colspan="12" class="empty-row">טוען נתונים...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- מודאל הוספה/עריכה -->
  <div id="leadOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">הוספת ליד חדש</h2>
        <button class="icon-x" id="closeLeadModalBtn">✕</button>
      </div>
      <form id="leadForm" class="modal-body">
        <input type="hidden" id="leadId">

        <div class="field">
          <label>מקור הליד</label>
          <input type="text" id="f_source" list="sourceOptions" placeholder="לדוגמה: פייסבוק, גוגל, המלצה, אתר...">
          <datalist id="sourceOptions">
            <option value="דף נחיתה">
            <option value="פייסבוק">
            <option value="גוגל">
            <option value="המלצה">
            <option value="אתר">
            <option value="לינקדאין">
            <option value="ידני">
          </datalist>
        </div>

        <div class="row2">
          <div>
            <label>שם חברה</label>
            <input type="text" id="f_company">
          </div>
          <div>
            <label>ח.פ</label>
            <input type="text" id="f_companyId">
          </div>
        </div>

        <div class="row2">
          <div>
            <label>שם איש קשר</label>
            <input type="text" id="f_contactName">
          </div>
          <div>
            <label>תפקיד</label>
            <input type="text" id="f_role">
          </div>
        </div>

        <div class="row2">
          <div>
            <label>נייד</label>
            <input type="tel" id="f_phone">
          </div>
          <div>
            <label>אימייל</label>
            <input type="email" id="f_email">
          </div>
        </div>

        <div class="field">
          <label>הערות</label>
          <textarea id="f_notes" rows="3"></textarea>
        </div>

        <div class="field">
          <label>סטטוס</label>
          <select id="f_status"></select>
        </div>

        <footer class="modal-actions">
          <button type="button" id="deleteLeadBtn" class="btn btn-danger hidden">מחיקת ליד</button>
          <div class="spacer"></div>
          <button type="button" id="cancelLeadBtn" class="btn btn-plain">ביטול</button>
          <button type="submit" class="btn btn-primary">שמירה</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- מודאל שליחת וואטסאפ -->
  <div id="waOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h2>שליחת הודעת וואטסאפ</h2>
        <button class="icon-x" id="closeWaModalBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>נמענים נבחרים</label>
          <div class="recipients-list" id="recipientsList"></div>
        </div>
        <div class="field">
          <label>בחירת תבנית מאושרת</label>
          <div class="template-choice" id="templateChoice"></div>
        </div>
        <div id="waMsg" class="admin-msg"></div>
      </div>
      <footer class="modal-actions">
        <button type="button" id="cancelWaBtn" class="btn btn-plain">ביטול</button>
        <button type="button" id="sendWaBtn" class="btn btn-wa" style="opacity:1;cursor:pointer">שליחה</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <?!= include('JavaScript'); ?>
</body>
</html>
