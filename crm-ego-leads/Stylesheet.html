<style>
  :root {
    --ink: #1e2130;
    --accent: #2f3374;
    --accent-dark: #22254f;
    --paper: #f5f6fa;
    --surface: #ffffff;
    --border: #ebedf3;
    --muted: #8a8fa3;
    --danger: #e2445c;
    --danger-bg: #fdeaed;
    --ok: #1f9d55;
    --ok-bg: #e7f8ee;
    --sidebar-w: 236px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif;
  }

  .shell { display: flex; min-height: 100vh; }

  /* --- סיידבר (ימין, RTL) --- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border); padding: 20px 16px; display: flex;
    flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand svg { width: 28px; height: 28px; flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-text .name { font-size: 15px; font-weight: 700; }
  .brand-text .sub { font-size: 10.5px; color: var(--muted); }

  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px;
    font-size: 13.5px; color: var(--muted); font-weight: 600; cursor: default;
  }
  .nav-item .ic { font-size: 15px; width: 18px; text-align: center; }
  .nav-item.active { background: var(--paper); color: var(--accent); position: relative; }
  .nav-item.active::before {
    content: ""; position: absolute; right: -16px; top: 8px; bottom: 8px; width: 3px;
    background: var(--accent); border-radius: 3px 0 0 3px;
  }

  .sidebar-footer { margin-top: auto; }
  .upgrade-card {
    background: var(--accent); color: #fff; border-radius: 12px; padding: 14px;
    font-size: 11.5px; line-height: 1.5;
  }
  .upgrade-card .t { font-weight: 700; font-size: 12.5px; margin-bottom: 3px; }

  /* --- תוכן ראשי --- */
  .content { flex: 1; min-width: 0; padding: 22px 28px 50px; }

  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .hub-actions { display: flex; gap: 10px; }
  .hub-btn { padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; white-space: nowrap; background: var(--surface); color: var(--ink); }
  .hub-btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hub-btn.accent:hover { background: var(--accent-dark); }
  .hub-btn:hover { background: var(--paper); }

  /* --- כרטיסי סטטיסטיקה --- */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 2px rgba(20,22,40,0.03);
  }
  .stat-card.stat-clickable { cursor: pointer; }
  .stat-card .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .stat-card .n { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .l { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

  /* --- כרטיס טבלה --- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,22,40,0.03); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card-head h2 { font-size: 15px; margin: 0; font-weight: 700; }

  .search-input, .status-filter, select, input, textarea {
    font-family: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--paper); color: var(--ink);
  }
  .search-input { min-width: 220px; flex: 1; }
  .count-pill { margin-inline-start: auto; font-size: 12px; color: var(--muted); }

  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-wa { background: var(--ok); color: #fff; }
  .btn-wa:disabled { background: #b9c3bd; cursor: not-allowed; opacity: 0.7; }
  .btn-plain { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }

  .table-wrap {
    overflow: auto;
    /* גובה חסום כדי שהטבלה עצמה תגלול פנימית - זה מה שמאפשר ל-sticky על
       ה-th להיצמד באמינות לראש הטבלה, ר' הערה דומה בתבנית הבסיסית. */
    max-height: calc(100vh - var(--table-offset, 330px));
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1050px; }
  th {
    text-align: right; padding: 11px 14px; background: var(--paper); border-bottom: 1px solid var(--border);
    color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 11.5px; position: sticky; top: 0; z-index: 5;
  }
  td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }

  .contact-cell { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .contact-text { display: flex; flex-direction: column; line-height: 1.35; }
  .contact-text .nm { font-weight: 600; font-size: 13px; }
  .contact-text .co { font-size: 11.5px; color: var(--muted); }

  .reply-cell { display: flex; flex-direction: column; gap: 3px; max-width: 200px; }
  .reply-cell .reply-text { white-space: normal; }
  .reply-cell .reply-date { font-size: 10.5px; color: var(--muted); }
  tbody tr:hover { background: var(--paper); cursor: pointer; }
  tbody tr.selected { background: #eef0fb; }

  .empty-row { text-align: center; color: var(--muted); padding: 30px !important; cursor: default; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .row-edit, .row-agent { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted); }
  .row-agent { font-size: 17px; margin-inline-start: 4px; }
  .icon-x { background: none; border: none; font-size: 17px; cursor: pointer; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(20,22,40,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.hidden { display: none; }

  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,0.25); }
  .modal.modal-wide { max-width: 780px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 13px; }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); }

  .template-choice { display: flex; flex-direction: column; gap: 8px; }
  .tpl-option { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
  .tpl-option.checked { border-color: var(--accent); background: #eef0fb; }

  .recipients-list { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
  .recipients-list span { background: var(--paper); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }

  .admin-msg { font-size: 12.5px; color: var(--danger); }

  footer.modal-actions { display: flex; gap: 10px; padding: 6px 20px 18px; justify-content: flex-end; }
  .spacer { flex: 1; }
  .hidden { display: none !important; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 100; }
  .toast.error { background: var(--danger); }

  /* --- מודאל שיחת סוכנת קולית --- */
  .agent-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  .agent-meta-item { font-size: 12.5px; color: var(--muted); }
  #agentSummaryText { font-size: 13.5px; line-height: 1.6; }
  .agent-audio { width: 100%; margin-bottom: 14px; }
  .agent-transcript-panel { background: var(--paper); border-radius: 12px; padding: 16px 18px; margin-top: 4px; }
  .agent-transcript-title { font-weight: 700; font-size: 14.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .agent-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; }
  .agent-row:last-child { margin-bottom: 0; }
  .agent-row.agent { justify-content: flex-start; }
  .agent-row.lead { justify-content: flex-end; }
  .agent-avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .agent-avatar.agent { background: #9aa0b8; }
  .agent-avatar.lead { background: var(--ok); }
  .agent-msg { max-width: 65%; display: flex; flex-direction: column; gap: 3px; }
  .agent-msg-label { font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .agent-bubble { padding: 9px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .agent-bubble.agent { background: var(--surface); border: 1px solid var(--border); border-top-right-radius: 3px; }
  .agent-bubble.lead { background: var(--ok-bg); border-top-left-radius: 3px; }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; border-left: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .nav { flex-direction: row; }
    .sidebar-footer { display: none; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
