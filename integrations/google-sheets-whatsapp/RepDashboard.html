  *{box-sizing:border-box}
  :root{
    --bg:#EEF1F6; --surface:#fff; --surface2:#F8FAFC; --border:#E3E6EC;
    --text:#151824; --muted:#6B7280;
    --blue:#116dff; --green:#1FAA59; --purple:#7C5CFC; --orange:#F79009; --red:#F04438;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  }
  html,body{margin:0;padding:0;height:100%}
  body{direction:rtl;font-family:"Heebo","Segoe UI","Arial Hebrew",Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14.5px;overflow:hidden}
  .shell{display:flex;height:100vh;max-width:100vw;overflow:hidden}

  /* ---------- סרגל צד ---------- */
  .sidebar{width:214px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);
           padding:12px 11px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--border)}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#116dff,#5B9BFF);
              color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand-text{font-weight:800;font-size:14px;line-height:1.15}
  .brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
  .sec-label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding:0 4px}
  .tabs{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .tab{padding:7px 9px;border-radius:8px;font-size:13.5px;color:#475467;display:flex;align-items:center;

       font-family:inherit;width:100%;text-align:right}

  let dismissedBanner = false;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function digits(phone) { return String(phone || '').replace(/\D/g, ''); }

  function telHref(phone) {
    const d = digits(phone);
    if (!d) return '';
    return 'tel:' + (d.indexOf('972') === 0 ? '+' + d : d);
  }

  function prettyPhone(phone) {
    const d = digits(phone);
    if (d.indexOf('972') === 0) return '0' + d.slice(3);
    return d || '';
  }

  /** אייקון הערוץ שדרכו כבר פנינו לליד - כדי שהנציגה תדע אם הוא כבר
   *  דיבר עם פרלה או רק קיבל וואטסאפ, לפני שהיא מרימה טלפון. */
  function channelIcons_(channel) {
    const c = String(channel || '');
    const icons = [];
    if (c.indexOf('וואטסאפ') !== -1) {
      icons.push('<span class="ch" title="קיבל הודעת וואטסאפ">💬</span>');
    }
    if (c.indexOf('פרלה') !== -1) {
      icons.push('<span class="ch" title="שוחח עם פרלה">🤖</span>');
    }
    return icons.length ? '<span class="channels">' + icons.join('') + '</span>' : '';
  }

  function isFresh(lead) {
    if (!lead.assignedAtMs) return false;
    return (Date.now() - lead.assignedAtMs) < NEW_LEAD_MINUTES * 60 * 1000;
  }

  /**
   * "שעון חול": כמה זמן נותר עד שהליד חוזר לבד למיטוב (9 שעות רצופות
   * מההעברה). מציגה שעות ודקות עגולות, עם צבע שמתחדד ככל שהזמן אוזל -
   * ירוק (מעל 4 שעות) → כתום (עד שעה) → אדום (פחות משעה/עבר הזמן).
   */
  function timerInfo_(lead) {
    if (!lead.assignedAtMs) return null;
    const remaining = ASSIGNMENT_TIMEOUT_MS - (Date.now() - lead.assignedAtMs);
    if (remaining <= 0) return { cls: 'late', text: '⏳ הזמן עבר' };
    const totalMin = Math.ceil(remaining / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const text = '⏳ ' + (h > 0 ? h + 'ש ' : '') + m + 'ד\' נותרו';
    const cls = remaining > 4 * 60 * 60 * 1000 ? 'ok' : (remaining > 60 * 60 * 1000 ? 'warn' : 'late');
    return { cls: cls, text: text };
  }

  function showError(msg) {
    document.getElementById('errorBox').innerHTML =
      '<div class="err">' + esc(msg) + '</div>';
  }

  // ---------------- טעינה ----------------
  function load(silent) {
    google.script.run
      .withSuccessHandler(function (res) {
        document.getElementById('errorBox').innerHTML = '';
        const previous = seenIds;
        data = res;
        render();
        detectNewLeads_(previous);
      })
      .withFailureHandler(function (err) {
        if (!silent) showError(err && err.message ? err.message : err);
      })
      .getRepData(REP_KEY);
  }

  /**
   * משווה את רשימת הלידים הפתוחים למה שהיה בטעינה הקודמת. הטעינה
   * הראשונה לעולם לא מתריעה - אחרת כל רענון של הדף היה נראה כאילו
   * הגיעו עכשיו חמישה לידים חדשים.
   */
  function detectNewLeads_(previous) {
    const ids = {};
    data.open.forEach(function (l) { ids[l.id] = true; });
    if (previous) {
      const fresh = data.open.filter(function (l) { return !previous[l.id]; });
      if (fresh.length) {
        dismissedBanner = false;
        showBanner(fresh);
        notifyBrowser(fresh);
      }
    }
    seenIds = ids;
  }

  function showBanner(fresh) {
    if (dismissedBanner || !fresh.length) {
      document.getElementById('bannerBox').innerHTML = '';
      return;
    }
    const first = fresh[0];
    const extra = fresh.length > 1 ? ' (ועוד ' + (fresh.length - 1) + ')' : '';
    document.getElementById('bannerBox').innerHTML =
      '<div class="banner"><span class="bicon">🔔</span>' +
      '<div><div class="b1">ליד חדש הועבר אלייך' + esc(extra) + '</div>' +
      '<div class="b2">' + esc(first.name) + (first.company ? ' · ' + esc(first.company) : '') + '</div></div>' +
      '<button type="button" class="bx" id="bannerClose">✕</button></div>';
    const dismiss = function () {
      dismissedBanner = true;
      document.getElementById('bannerBox').innerHTML = '';
    };
    const close = document.getElementById('bannerClose');
    if (close) close.addEventListener('click', dismiss);
    // בכוונה **בלי** הסתרה אוטומטית - נשאר עד שסוגרים אותו ידנית. הייתה
    // גרסה עם היעלמות אחרי 15 שניות, אבל זה סיכון אמיתי שהנציגה תפספס
    // אותו אם היא לא מסתכלת בדיוק באותו רגע (בדיוק מה שקרה בבדיקה).
  }

  // התראת מערכת אמיתית - קופצת גם כשהטאב ברקע (טאב אחר/אפליקציה אחרת),
  // כל עוד הדף הזה עדיין פתוח איפשהו בדפדפן.
  function notifyBrowser(fresh) {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try {
      new Notification('ליד חדש הועבר אלייך', {
        body: fresh[0].name + (fresh[0].company ? ' · ' + fresh[0].company : ''),
        tag: 'mituv-lead'
      });
    } catch (e) { /* דפדפן שלא תומך - הבאנר בדף מספיק */ }
  }

  /**
   * מציגה/מסתירה את כפתור "🔔 הפעלת התראות" לפי מצב ההרשאה הנוכחי.
   * **בכוונה לא** קוראים ל-Notification.requestPermission() אוטומטית
   * בטעינת הדף - דפדפנים מודרניים חוסמים/מתעלמים משקט מבקשת הרשאה
   * שלא מגיעה מלחיצה אמיתית של המשתמש, ובדיוק זו הסיבה שההתראה לא
   * הופיעה בבדיקה. הכפתור נראה רק כשההרשאה עדיין לא הוכרעה.
   */
  function updateNotifBtn_() {
    const btn = document.getElementById('notifBtn');
    if (!btn) return;
    if (typeof Notification === 'undefined' || Notification.permission !== 'default') {
      btn.style.display = 'none';
      return;
    }
    btn.style.display = '';
  }

  function setupNotifBtn_() {
    const btn = document.getElementById('notifBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      try {
        Notification.requestPermission().then(function () { updateNotifBtn_(); });
      } catch (e) { /* מתעלמים */ }
    });
    updateNotifBtn_();
  }

  // ---------------- תצוגה ----------------
  function currentList() {
    const list = view === 'open' ? data.open : data.done;
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    return list.filter(function (l) {
      if (campFilter && l.campaign !== campFilter) return false;
      if (!q) return true;
      return String(l.name || '').toLowerCase().indexOf(q) !== -1 ||
             String(l.company || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    if (!data) return;
    const first = (data.repName || '').trim().slice(0, 2);
    document.getElementById('repAvatar').textContent = first;
    document.getElementById('repHello').innerHTML =
      'היי ' + esc(data.repName) + ' 👋<small>' +
      (data.open.length ? 'יש לך ' + data.open.length + ' לידים לטיפול' : 'אין לידים פתוחים - כל הכבוד!') +
      '</small>';

    document.getElementById('statOpen').textContent = data.open.length;
    document.getElementById('statToday').textContent = data.doneToday;
    document.getElementById('statTotal').textContent = data.doneTotal;
    document.getElementById('cntOpen').textContent = data.open.length;
    document.getElementById('cntDone').textContent = data.done.length;

    renderCampFilters();
    if (view === 'open') renderCards(); else renderDoneTable();
  }

  function renderCampFilters() {
    const counts = {};
    data.open.forEach(function (l) {
      const c = l.campaign || '(ללא קמפיין)';
      counts[c] = (counts[c] || 0) + 1;
    });
    const names = Object.keys(counts).sort();
    let html = '<button type="button" class="tab' + (campFilter ? '' : ' active') +
      '" data-camp="">הכל <span class="n">' + data.open.length + '</span></button>';
    names.forEach(function (c) {
      html += '<button type="button" class="tab' + (campFilter === c ? ' active' : '') +
        '" data-camp="' + esc(c) + '">' + esc(c) + ' <span class="n">' + counts[c] + '</span></button>';
    });
    const wrap = document.getElementById('campFilters');
    wrap.innerHTML = html;
    wrap.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        campFilter = btn.getAttribute('data-camp');
        render();
      });
    });
  }

  function renderCards() {
    document.getElementById('doneWrap').style.display = 'none';
    const grid = document.getElementById('grid');
    grid.style.display = '';
    const list = currentList();

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state">' +
        (data.open.length ? 'אין לידים שמתאימים לסינון הנוכחי' : '🎉 אין לידים פתוחים - סיימת הכל!') +
        '</div>';
      return;
    }

    grid.innerHTML = list.map(function (l) {
      const timer = timerInfo_(l);
      // בכוונה **לא** מוצג כאן תמלול/סיכום גולמי מפרלה (l.history) - רק
      // ההערה שטליה כתבה. תובנות על השיחה (סיכום+טיפ) זמינות לנציגה רק
      // דרך שרביט ה-AI (מעובד), לא כטקסט גולמי על הכרטיס.
      return '<div class="lead' + (isFresh(l) ? ' fresh' : '') + '">' +
        (isFresh(l) ? '<div class="newtag">חדש</div>' : '') +
        (timer ? '<div class="timer ' + timer.cls + '">' + timer.text + '</div>' : '') +
        '<div class="co">' + esc(l.company) + '</div>' +
        '<div class="nm">' + esc(l.name) + '</div>' +
        (l.campaign ? '<span class="camp">' + esc(l.campaign) + '</span>' : '') +
        channelIcons_(l.channel) +
        (l.noteToRep ? '<div class="repnote"><b>הערה מטליה:</b> ' + esc(l.noteToRep) + '</div>' : '') +
        '<div class="info">' +
          '<div class="info-row"><b>טלפון</b><span>' + esc(prettyPhone(l.phone)) + '</span></div>' +
          '<div class="info-row"><b>מייל</b><span>' + esc(l.email || '—') + '</span></div>' +
        '</div>' +
        '<div class="actrow">' +
          '<button type="button" class="done" data-id="' + esc(l.id) + '">✓ סיימתי לטפל</button>' +
          '<button type="button" class="ai" data-ai="' + esc(l.id) + '" title="סיכום AI וטיפ מכירה">✨</button>' +
        '</div>' +
      '</div>';
    }).join('');

    grid.querySelectorAll('.done').forEach(function (btn) {
      btn.addEventListener('click', function () { openDoneModal(btn.getAttribute('data-id')); });
    });
    grid.querySelectorAll('.ai').forEach(function (btn) {
      btn.addEventListener('click', function () { openAiModal(btn.getAttribute('data-ai')); });
    });
  }

  function renderDoneTable() {
    document.getElementById('grid').style.display = 'none';
    const wrap = document.getElementById('doneWrap');
    wrap.style.display = '';
    const list = currentList();

    if (!list.length) {
      wrap.innerHTML = '<div class="empty-state">עדיין לא טופלו לידים</div>';
      return;
    }

    wrap.innerHTML = '<table><thead><tr>' +
      '<th style="width:13%">תאריך טיפול</th><th style="width:20%">שם חברה</th>' +
      '<th style="width:15%">איש קשר</th><th style="width:17%">קמפיין</th>' +
      '<th style="width:14%">סטטוס</th><th>הערה שכתבתי</th>' +
      '</tr></thead><tbody>' +
      list.map(function (l) {
        return '<tr><td>' + esc(l.doneAt) + '</td><td>' + esc(l.company) + '</td>' +
          '<td><b>' + esc(l.name) + '</b></td><td>' + esc(l.campaign) + '</td>' +
          '<td><span class="pill" style="background:rgba(31,170,89,.14);color:#137A43">' +
            esc(l.status) + '</span></td>' +
          '<td class="note-full">' + esc(l.note || '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function findLead(id) {
    const all = data.open.concat(data.done);
    for (let i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  // ---------------- סיום טיפול ----------------
  function openDoneModal(id) {
    activeLead = findLead(id);
    if (!activeLead) return;
    chosenStatus = '';
    document.getElementById('doneTitle').textContent = '✓ סיימת לטפל ב' + activeLead.name + '?';
    document.getElementById('doneSub').textContent =
      [activeLead.company, activeLead.campaign].filter(Boolean).join(' · ') +
      ' · בחרי מה קרה, וזה יתעדכן אצל טליה אוטומטית';
    document.getElementById('doneNote').value = '';
    document.getElementById('doneErr').textContent = '';
    document.getElementById('doneConfirm').disabled = false;

    const opts = document.getElementById('statusOpts');
    const icons = { 'תואמה פגישה': '📅', 'בתהליך': '⏳', 'בתהליך עתידי': '🗓️', 'לא מעוניין': '🚫', 'סגור פניה': '🔒' };
    opts.innerHTML = (data.quickStatuses || []).map(function (s) {
      return '<button type="button" data-status="' + esc(s) + '">' +
        (icons[s] ? icons[s] + ' ' : '') + esc(s) + '</button>';
    }).join('') + '<button type="button" class="other" id="showFullList">אחר... (כל רשימת הסטטוסים)</button>';

    const sel = document.getElementById('fullStatusSel');
    sel.classList.remove('show');
    sel.innerHTML = '<option value="">בחרי סטטוס מהרשימה המלאה...</option>' +
      (data.statusList || []).map(function (s) {
        return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
      }).join('');

    opts.querySelectorAll('button[data-status]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        chosenStatus = btn.getAttribute('data-status');
        sel.value = '';
        opts.querySelectorAll('button').forEach(function (b) { b.classList.remove('sel'); });
        btn.classList.add('sel');
      });
    });
    document.getElementById('showFullList').addEventListener('click', function () {
      sel.classList.add('show');
      sel.focus();
    });
    sel.addEventListener('change', function () {
      chosenStatus = sel.value;
      opts.querySelectorAll('button').forEach(function (b) { b.classList.remove('sel'); });
    });

    document.getElementById('doneModal').classList.add('show');
  }

  function confirmDone() {
    if (!activeLead) return;
    if (!chosenStatus) {
      document.getElementById('doneErr').textContent = 'יש לבחור סטטוס';
      return;
    }
    const note = document.getElementById('doneNote').value.trim();
    if (!note) {
      document.getElementById('doneErr').textContent = 'יש לכתוב הערה לפני סיום הטיפול';
      document.getElementById('doneNote').focus();
      return;
    }
    const btn = document.getElementById('doneConfirm');
    btn.disabled = true;
    btn.textContent = 'שומרת...';
    const lead = activeLead;
    const status = chosenStatus;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.textContent = 'אישור וסיום';
        document.getElementById('doneModal').classList.remove('show');
        celebrate(res, lead, status);
        load(true);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'אישור וסיום';
        document.getElementById('doneErr').textContent = (err && err.message) ? err.message : err;
      })
      .completeAssignment(REP_KEY, lead.id, status, note);
  }

  // ---------------- חגיגות ----------------
  // שלוש אפשרויות בלבד: "תואמה פגישה" - קונפטי. "לא מעוניין" - לבבות
  // + הודעה שהליד חוזר לטליה לבדיקה נוספת. כל סטטוס אחר (כולל "סגור
  // פניה"/"בתהליך עתידי") - נסגר בשקט, בלי שום פופ-אפ (בקשה מפורשת).
  function celebrate(res, lead, status) {
    const isMeeting = !!(res && res.celebrate);
    const isSorry = !!(res && res.sorry);
    if (!isMeeting && !isSorry) return;

    const box = document.getElementById('celebrate');
    box.innerHTML = '';
    box.classList.add('show');

    if (isMeeting) {
      const colors = ['#116dff', '#1FAA59', '#F79009', '#F04438', '#7C5CFC', '#FBBF24', '#06B6D4'];
      for (let i = 0; i < 130; i++) {
        const p = document.createElement('i');
        const size = 6 + Math.random() * 6;
        const startX = 50 + (Math.random() * 60 - 30);
        const dur = 1400 + Math.random() * 900;
        p.style.cssText = 'position:absolute;left:' + startX + 'vw;top:-6vh;width:' + size + 'px;' +
          'height:' + (size * 1.5) + 'px;background:' + colors[i % colors.length] + ';border-radius:2px;' +
          'transform:rotate(' + (Math.random() * 360) + 'deg);opacity:1;' +
          'transition:transform ' + dur + 'ms linear, top ' + dur + 'ms ease-in, opacity ' + dur + 'ms ease-in;';
        box.appendChild(p);
        (function (p, dur) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              p.style.top = (75 + Math.random() * 30) + 'vh';
              p.style.transform = 'translateX(' + (Math.random() * 240 - 120) + 'px) rotate(' +
                (Math.random() * 1080) + 'deg)';
              p.style.opacity = '0';
            });
          });
        })(p, dur);
      }
      box.insertAdjacentHTML('beforeend',
        '<div class="toast"><div class="big">🎉</div>' +
        '<h4>מעולה ' + esc(data.repName) + '! פגישה תואמה</h4>' +
        '<p>' + esc(lead.name) + (lead.company ? ' · ' + esc(lead.company) : '') +
        ' · הסטטוס עודכן אצל טליה</p></div>');
    } else {
      const emoji = ['❤️', '👍', '💚', '⭐', '👏', '💙'];
      for (let i = 0; i < 24; i++) {
        const s = document.createElement('span');
        const dur = 1500 + Math.random() * 900;
        s.textContent = emoji[i % emoji.length];
        s.style.cssText = 'position:absolute;left:' + (8 + Math.random() * 84) + 'vw;top:' +
          (70 + Math.random() * 20) + 'vh;font-size:' + (20 + Math.random() * 16) + 'px;opacity:1;' +
          'transition:transform ' + dur + 'ms ease-out, opacity ' + dur + 'ms ease-in;';
        box.appendChild(s);
        (function (s, dur) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              s.style.transform = 'translateY(-' + (40 + Math.random() * 45) + 'vh) translateX(' +
                (Math.random() * 90 - 45) + 'px) scale(' + (0.6 + Math.random() * 0.7) + ')';
              s.style.opacity = '0';
            });
          });
        })(s, dur);
      }
      box.insertAdjacentHTML('beforeend',
        '<div class="toast soft"><div class="big">💜</div>' +
        '<h4>תודה שניסית!</h4>' +
        '<p>הליד יועבר לבדיקה נוספת כדי למצות את ההזדמנות</p></div>');
    }

    setTimeout(function () {
      box.classList.remove('show');
      box.innerHTML = '';
    }, 2600);
  }

  // ---------------- סיכום AI ----------------
  function openAiModal(id) {
    const lead = findLead(id);
    if (!lead) return;
    document.getElementById('aiTitle').textContent = '✨ ' + lead.name +
      (lead.company ? ' · ' + lead.company : '');
    document.getElementById('aiSub').textContent =
      [lead.campaign, 'הועבר אלייך ב-' + lead.assignedAt].filter(Boolean).join(' · ');
    document.getElementById('aiCall').href = telHref(lead.phone) || '#';
    document.getElementById('aiBody').innerHTML =
      '<div class="aibox sum"><h5>📝 סיכום השיחה עד עכשיו</h5><p>מכינה סיכום...</p></div>';
    document.getElementById('aiModal').classList.add('show');

    // כוונה מפורשת של הלקוחה: הנציגה רואה רק את ההערה שטליה כתבה לה +
    // תובנות מעובדות (סיכום + טיפ) דרך השרביט - לעולם לא את התמלול/סיכום
    // הגולמי של פרלה. ה-AI עצמו כן מקבל את כל התיעוד בצד השרת
    // (getRepAiSummary), רק לא מציגים אותו לנציגה בשום מקום בדף.
    google.script.run
      .withSuccessHandler(function (res) {
        document.getElementById('aiBody').innerHTML =
          '<div class="aibox sum"><h5>📝 סיכום השיחה עד עכשיו</h5><p>' +
            esc(res.summary || 'לא התקבל סיכום') + '</p></div>' +
          (res.salesTip ? '<div class="aibox tip"><h5>🪄 טיפ מכירה</h5><p>' +
            esc(res.salesTip) + '</p></div>' : '');
      })
      .withFailureHandler(function (err) {
        document.getElementById('aiBody').innerHTML =
          '<div class="err">' + esc((err && err.message) ? err.message : err) + '</div>';
      })
      .getRepAiSummary(REP_KEY, lead.id);
  }

  const SEAMLESS_RECENT_KEY_ = 'seamlessRecentSearches';
  let seamlessSearchToken_ = 0;

  function seamlessRecentSearches_() {
    try {
      const raw = localStorage.getItem(SEAMLESS_RECENT_KEY_);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (err) { return []; }
  }

  function seamlessAddRecentSearch_(entry) {
    try {
      let list = seamlessRecentSearches_().filter(function (x) {
        return !(x.title === entry.title && x.company === entry.company);
      });
      list.unshift(entry);
      localStorage.setItem(SEAMLESS_RECENT_KEY_, JSON.stringify(list.slice(0, 5)));
    } catch (err) { /* localStorage לא זמין - פשוט בלי היסטוריה, לא קריטי */ }
  }

  /**
   * חיפוש Seamless בשורת הכותרת - זהה בהתנהגות לגרסה בדשבורד הראשי.
   * טלפון/אימייל של אנשי קשר מסימלס נחשפים בנפרד אחרי התוצאה הראשונית.
   */
  function setupSeamlessSearch_() {
    const triggerBox = document.getElementById('seamlessTriggerBox');
    const dropdown = document.getElementById('seamlessDropdown');
    const scrollArea = document.getElementById('seamlessDdScroll');
    const topLabel = document.getElementById('seamlessDdTopLabel');
    const fieldTitle = document.getElementById('seamlessFieldTitle');
    const fieldCompany = document.getElementById('seamlessFieldCompany');
    const translateBtn = document.getElementById('seamlessTranslateBtn');
    const searchBtn = document.getElementById('seamlessSearchBtn');
    if (!triggerBox || !dropdown) return;

    function closeDropdown_() { dropdown.style.display = 'none'; triggerBox.classList.remove('open'); }
    function openDropdown_() { dropdown.style.display = 'block'; triggerBox.classList.add('open'); }

    function renderRecent_() {
      topLabel.textContent = 'חיפושים אחרונים';
      const recent = seamlessRecentSearches_();
      if (!recent.length) {
        scrollArea.innerHTML = '<div class="seamless-dd-empty">עוד אין חיפושים - מלאי תפקיד ו/או חברה למעלה</div>';
        return;
      }
      scrollArea.innerHTML = recent.map(function (r, i) {
        const label = [r.title, r.company].filter(Boolean).join(' · ') || '(ריק)';
        return '<div class="seamless-recent-row" data-i="' + i + '">' +
          '<span class="ic">🕓</span><span class="q">' + esc(label) + '</span></div>';
      }).join('');
      scrollArea.querySelectorAll('.seamless-recent-row').forEach(function (row) {
        row.addEventListener('click', function () {
          const r = recent[Number(row.dataset.i)];
          if (!r) return;
          fieldTitle.value = r.title || '';
          fieldCompany.value = r.company || '';
          runSeamlessSearch_(r.title || '', r.company || '');
        });
      });
    }

    // תוצאות אנשי הקשר החדשים מ-Seamless של החיפוש הנוכחי - במצב הזה כדי
    // שאפשר יהיה למיין אותן מחדש (מי שיש לו נייד/אימייל קודם) ברגע
    // שפרטי הקשר מתגלים, בלי לחפש מהתחלה.
    let seamlessCurrentContacts_ = [];

    function contactRowHtml_(c) {
      const base = [c.title, c.company].filter(Boolean).join(' - ');
      let subHtml;
      if (c._revealStatus === 'completed') {
        const bits = [];
        if (c.phone) bits.push('📱 ' + esc(c.phone));
        if (c.email) bits.push('✉️ ' + esc(c.email));
        subHtml = (base ? esc(base) + ' · ' : '') +
          (bits.length ? bits.join(' · ') : 'סימלס לא מחזיקה טלפון/אימייל עבור איש קשר זה');
      } else if (c._revealStatus === 'failed') {
        subHtml = esc(base) + (base ? ' · ' : '') + 'חשיפת פרטי קשר נכשלה';
      } else if (c._revealStatus === 'timeout') {
        subHtml = esc(base) + (base ? ' · ' : '') +
          'לא הצלחנו לחשוף בזמן - <a href="#" class="seamless-retry-reveal" data-sid="' + esc(c.searchResultId) + '">נסי שוב</a>';
      } else {
        subHtml = (base ? esc(base) + ' · ' : '') + 'טוען פרטי קשר...';
      }
      return '<div class="seamless-dd-row"><div class="seamless-dd-name">' + esc(c.name) + '</div>' +
        '<div class="seamless-dd-sub">' + subHtml + '</div></div>';
    }

    // מי שיש לו נייד עולה קודם, אחר כך מי שיש לו רק אימייל, ואז כל
    // השאר (עדיין בתהליך/אין פרטים) - נשארים לפי הסדר המקורי מסימלס.
    function seamlessContactScore_(c) {
      if (c.phone) return 2;
      if (c.email) return 1;
      return 0;
    }

    function renderContactsGroup_() {
      const el = document.getElementById('seamlessNewContactsGroup');
      if (el) el.innerHTML = seamlessCurrentContacts_.map(contactRowHtml_).join('');
    }

    function renderResults_(title, company, payload) {
      topLabel.textContent = 'תואמות החיפוש';
      let html = '';

      if (payload.existingLeads && payload.existingLeads.length) {
        html += '<div class="seamless-dd-group">אנשי קשר במערכת</div>';
        html += payload.existingLeads.map(function (c) {
          return '<div class="seamless-dd-row"><div class="seamless-dd-name">' + esc(c.name || c.company || 'ללא שם') + '</div>' +
            '<div class="seamless-dd-sub">' + esc([c.title, c.company].filter(Boolean).join(' - ')) +
            ' · קמפיין ' + esc(c.campaign) + '</div></div>';
        }).join('');
      }

      seamlessCurrentContacts_ = (payload.seamlessContacts || []).filter(function (c) { return c.name; });
      if (seamlessCurrentContacts_.length) {
        html += '<div class="seamless-dd-group">נמצא ב-Seamless · לא במערכת</div>';
        html += '<div id="seamlessNewContactsGroup">' + seamlessCurrentContacts_.map(contactRowHtml_).join('') + '</div>';
      }

      if (payload.seamlessCompanies && payload.seamlessCompanies.length) {
        html += '<div class="seamless-dd-group">חברות</div>';
        html += payload.seamlessCompanies.map(function (co) {
          return '<div class="seamless-dd-company"><div class="seamless-dd-company-ic"></div>' +
            '<div class="seamless-dd-company-name">' + esc(co.name || co.domain || '') + '</div></div>';
        }).join('');
      }

      if (!html) {
        const label = [title, company].filter(Boolean).join(' · ');
        html = '<div class="seamless-dd-empty">אין תוצאות עבור "' + esc(label) + '"</div>';
      }
      if (payload.seamlessError) {
        html += '<div class="seamless-dd-error">' + esc(payload.seamlessError) + '</div>';
      }
      html += '<div class="seamless-dd-foot">התוצאות הן תיעוד חיפוש בלבד - לא יוצרות או משנות ליד באופן אוטומטי</div>';

      scrollArea.innerHTML = html;

      const idsToReveal = seamlessCurrentContacts_.map(function (c) { return c.searchResultId; }).filter(Boolean);
      if (idsToReveal.length) revealSeamlessContacts_(idsToReveal);
    }

    function markRevealTimedOut_(ids) {
      seamlessCurrentContacts_.forEach(function (c) {
        if (ids.indexOf(c.searchResultId) !== -1 && c._revealStatus !== 'completed') c._revealStatus = 'timeout';
      });
      renderContactsGroup_();
    }

    /**
     * אם google.script.run לא חוזר כלל תוך 15 שניות - מחליפים "טוען..."
     * בקישור "נסי שוב", כדי שהשורה לא תישאר תקועה לצמיתות. ברגע שכל
     * הפרטים חוזרים - ממיינים מחדש כדי שמי שיש לו נייד/אימייל יעלה קודם.
     */
    function revealSeamlessContacts_(ids) {
      const token = seamlessSearchToken_;
      let settled = false;
      const timeoutId = setTimeout(function () {
        if (settled || token !== seamlessSearchToken_) return;
        settled = true;
        markRevealTimedOut_(ids);
      }, 25000);

      google.script.run
        .withSuccessHandler(function (revealed) {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          if (token !== seamlessSearchToken_ || !revealed) return;
          seamlessCurrentContacts_.forEach(function (c) {
            const info = revealed[c.searchResultId];
            if (!info || ids.indexOf(c.searchResultId) === -1) return;
            if (info.status === 'pending') { c._revealStatus = 'timeout'; return; }
            c.phone = info.phone;
            c.email = info.email;
            c._revealStatus = info.status === 'failed' ? 'failed' : 'completed';
          });
          seamlessCurrentContacts_.sort(function (a, b) { return seamlessContactScore_(b) - seamlessContactScore_(a); });
          renderContactsGroup_();
        })
        .withFailureHandler(function () {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          if (token === seamlessSearchToken_) markRevealTimedOut_(ids);
        })
        .revealSeamlessContacts(ids);
    }

    function runSeamlessSearch_(titleVal, companyVal) {
      const t = titleVal.trim();
      const c = companyVal.trim();
      openDropdown_();
      if (!t && !c) { renderRecent_(); return; }

      seamlessSearchToken_++;
      const token = seamlessSearchToken_;
      topLabel.textContent = 'מחפש...';
      scrollArea.innerHTML = '';

      google.script.run
        .withSuccessHandler(function (payload) {
          if (token !== seamlessSearchToken_) return;
          renderResults_(t, c, payload || {});
          seamlessAddRecentSearch_({ title: t, company: c });
        })
        .withFailureHandler(function (err) {
          if (token !== seamlessSearchToken_) return;
          topLabel.textContent = 'תואמות החיפוש';
          scrollArea.innerHTML = '<div class="seamless-dd-error">שגיאה בחיפוש: ' + esc(err && err.message ? err.message : String(err)) + '</div>';
        })
        .searchSeamless(t, c);
    }

    /** מתרגמת שדה בודד עברית → אנגלית באמצעות שירות התרגום של גוגל. */
    function translateField_(field) {
      const val = field.value.trim();
      if (!val) return Promise.resolve();
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (translated) {
            if (translated) field.value = translated;
            resolve();
          })
          .withFailureHandler(resolve)
          .translateToEnglish(val);
      });
    }

    triggerBox.addEventListener('click', function () {
      if (dropdown.style.display !== 'none') { closeDropdown_(); return; }
      openDropdown_();
      if (!fieldTitle.value.trim() && !fieldCompany.value.trim()) renderRecent_();
    });
    searchBtn.addEventListener('click', function () {
      runSeamlessSearch_(fieldTitle.value, fieldCompany.value);
    });
    [fieldTitle, fieldCompany].forEach(function (f) {
      f.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); runSeamlessSearch_(fieldTitle.value, fieldCompany.value); }
      });
    });
    translateBtn.addEventListener('click', function () {
      translateBtn.disabled = true;
      translateBtn.textContent = 'מתרגם...';
      Promise.all([translateField_(fieldTitle), translateField_(fieldCompany)]).then(function () {
        translateBtn.disabled = false;
        translateBtn.textContent = '🌐 תרגם לאנגלית';
      });
    });
    document.addEventListener('click', function (e) {
      const retryLink = e.target.closest('.seamless-retry-reveal');
      if (retryLink) {
        e.preventDefault();
        revealSeamlessContacts_([retryLink.dataset.sid]);
        return;
      }
      if (!e.target.closest('#seamlessSearchWrap')) closeDropdown_();
    });
  }

  // ---------------- חיווט ----------------
  document.querySelectorAll('.vt button[data-view]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      view = btn.getAttribute('data-view');
      document.querySelectorAll('.vt button[data-view]').forEach(function (b) {
        b.classList.toggle('on', b === btn);
      });
      render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('doneCancel').addEventListener('click', function () {
    document.getElementById('doneModal').classList.remove('show');
  });
  document.getElementById('doneConfirm').addEventListener('click', confirmDone);
  document.getElementById('aiClose').addEventListener('click', function () {
    document.getElementById('aiModal').classList.remove('show');
  });
  [['doneModal'], ['aiModal']].forEach(function (pair) {
    const el = document.getElementById(pair[0]);
    el.addEventListener('click', function (e) { if (e.target === el) el.classList.remove('show'); });
  });

  // "מחממים" את הצליל בלחיצה/הקשה **אמיתית** הראשונה של הנציגה על הדף -
  setupNotifBtn_();
  setupSeamlessSearch_();
  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
})();
</script>
