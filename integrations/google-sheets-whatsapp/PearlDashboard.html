  :root {
    --bg: #F5F6F9;
    --bg-2: #EEF3FB;
    --surface: #FFFFFF;
    --surface-2: #F2F4F7;
    --border: #E3E6EC;
    --text: #1B1D22;
    --text-muted: #667085;
    --accent: #116DFF;
    --accent-soft: #E8F0FF;
    --accent-ink: #0B4FC4;
    --good: #1FAA59;
    --good-soft: #E5F6EC;
    --bad: #E1442F;
    --bad-soft: #FCE9E7;
    --pending: #B7791F;
    --pending-soft: #FBF0DD;
    --shadow: 0 1px 2px rgba(17,17,31,0.05), 0 8px 24px rgba(17,17,31,0.06);
    --radius: 12px;
    --radius-btn: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --bg-2: #14171D; --surface: #171A20; --surface-2: #1D2129;
      --border: #2A2E37; --text: #ECEEF2; --text-muted: #9AA0AC;
      --accent: #4C93FF; --accent-soft: #1B2A42; --accent-ink: #BCD6FF;
      --good: #34D399; --good-soft: #10291B; --bad: #F87171; --bad-soft: #341714;
      --pending: #FBBF24; --pending-soft: #332507;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: linear-gradient(150deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    direction: rtl;
    line-height: 1.5;
  }

  .page {
    max-width: 1500px;
    margin: 0 auto;
    padding: 14px 18px 22px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- כותרת --- */
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #2E82FF, #7C5CFC);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
  .brand .sub { font-size: 11.5px; color: var(--text-muted); margin-top: -2px; }

  .top .spacer { flex: 1; }

  select, input[type="search"] {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-btn); padding: 7px 10px; outline: none;
  }
  select:focus, input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"] { width: 210px; }

  .btn {
    font-family: inherit; font-size: 13px; font-weight: 600;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-btn);
    padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:hover { background: var(--surface); }

  /* --- קוביות --- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 11px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 12px 10px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 2.5px;
    background: var(--border);
  }
  .stat .k { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .stat .v { font-size: 25px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; }
  .stat .h { font-size: 11px; color: var(--text-muted); }
  .stat.hero::before { background: linear-gradient(90deg, #E1442F, #F0885B); }
  .stat.hero { background: var(--bad-soft); border-color: rgba(225,68,47,0.35); }
  .stat.hero .v { color: var(--bad); }
  .stat.ok::before { background: var(--good); }
  .stat.wait::before { background: var(--pending); }

  /* --- מסננים --- */
  .filters {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    margin-bottom: 9px;
  }
  .chip {
    font-size: 12px; font-weight: 600; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 11px; color: var(--text-muted);
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .chip .n { opacity: 0.7; font-weight: 700; margin-inline-start: 4px; }
  .chip.tag::before { content: '🏷 '; }
  .filters .sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }

  /* --- סרגל פעולה --- */
  .actionbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; margin-bottom: 9px;
    box-shadow: var(--shadow);
  }
  .actionbar .count { font-size: 13px; font-weight: 700; }
  .actionbar .count span { color: var(--accent); }
  .actionbar .hint { font-size: 11.5px; color: var(--text-muted); }
  .actionbar .spacer { flex: 1; }

  /* --- טבלה --- */
  .table-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .table-scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-2); color: var(--text-muted);
    font-size: 11.5px; font-weight: 700; text-align: right;
    padding: 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th.c-pick { width: 38px; }
  th.c-phone { width: 12%; }
  th.c-name { width: 15%; }
  th.c-status { width: 14%; }
  th.c-tag { width: 13%; }
  th.c-att { width: 7%; }
  th.c-date { width: 11%; }
  th.c-sum { width: auto; }
  tbody td {
    padding: 6px 8px; border-bottom: 1px solid var(--border);
    font-size: 12.5px; vertical-align: middle;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.picked { background: var(--accent-soft); }
  tbody tr.picked:hover { background: var(--accent-soft); }
  .phone { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-muted); }

  .pill {
    display: inline-block; font-size: 11px; font-weight: 700;
    border-radius: 999px; padding: 2px 9px; white-space: nowrap;
    background: var(--surface-2); color: var(--text-muted);
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.wait { background: var(--pending-soft); color: var(--pending); }
  .pill.tag { background: var(--accent-soft); color: var(--accent-ink); }

  input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  .empty { padding: 34px 18px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

  /* --- חלונות --- */
  .modal-back {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(12,14,20,0.5); align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-back.on { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    width: 560px; max-width: 100%; max-height: 88vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal h2 { margin: 0; font-size: 16px; padding: 14px 16px 10px; }
  .modal .body { padding: 0 16px 8px; overflow: auto; font-size: 13px; }
  .modal .foot {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-start; align-items: center;
  }
  .modal .foot .spacer { flex: 1; }
  .lead-list {
    margin: 10px 0 4px; border: 1px solid var(--border); border-radius: 10px;
    max-height: 230px; overflow: auto;
  }
  .lead-list div {
    padding: 5px 10px; font-size: 12.5px; border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }
  .lead-list div:last-child { border-bottom: 0; }
  .note {
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; margin-top: 8px;
  }
  .note.warn { background: var(--pending-soft); color: var(--pending); }
  .err { color: var(--bad); font-size: 12.5px; margin-top: 8px; white-space: pre-wrap; }

  .loading { padding: 34px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #12151B; color: #fff; font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.on { opacity: 1; }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    th.c-sum, td.c-sum, th.c-tag, td.c-tag { display: none; }
  }
</style>

<div class="page">
  <div class="top">
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <h1>מסך פרלה</h1>
        <div class="sub">מה שפרלה עצמה רואה - סטטוסים, תגיות והחזרה לחיוג</div>
      </div>
    </div>
    <div class="spacer"></div>
    <select id="campaignSelect"></select>
    <input type="search" id="searchInput" placeholder="חיפוש טלפון / שם...">
    <button class="btn" id="refreshBtn">🔄 רענון</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters"></div>

  <div class="actionbar">
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer">
      <input type="checkbox" id="pickAll"> סמן את כל המוצגים
    </label>
    <button class="btn" id="pickUnreachedBtn">סמן את כל מי שלא ענה</button>
    <button class="btn" id="clearPickBtn">נקה בחירה</button>
    <div class="count">נבחרו <span id="pickCount">0</span></div>
    <div class="spacer"></div>
    <div class="hint" id="updatedAt"></div>
    <button class="btn primary" id="resetBtn" disabled>🔄 החזר לחדש</button>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="c-pick"></th>
            <th class="c-phone">טלפון</th>
            <th class="c-name">שם</th>
            <th class="c-status">סטטוס בפרלה</th>
            <th class="c-tag">תגית</th>
            <th class="c-att">ניסיונות</th>
            <th class="c-date">שיחה אחרונה</th>
            <th class="c-sum">סיכום השיחה</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="loading" id="loading">טוען מפרלה...</div>
      <div class="empty" id="empty" style="display:none">אין לידים שמתאימים לסינון.</div>

</div>

<div class="modal-back" id="confirmBack">
  <div class="modal">

</div>

<div class="modal-back" id="resultBack">

      <div class="spacer"></div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    'use strict';

    var PEARL_KEY = '<?!= pearlKey ?>';

    var state = {
      campaigns: [],
      pearlId: '',
      board: null,
      leads: [],
      picked: {},
      statusFilter: null,
      tagFilter: null,
      search: '',
      busy: false
    };

    var el = function (id) { return document.getElementById(id); };

    function esc(text) {
      return String(text === null || text === undefined ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toast(message) {
      var t = el('toast');
      t.textContent = message;
      t.classList.add('on');
      setTimeout(function () { t.classList.remove('on'); }, 2600);
    }

    function two(n) { return n < 10 ? '0' + n : '' + n; }

    function formatDate(ms) {
      if (!ms) return '';
      var d = new Date(ms);
      return two(d.getDate()) + '/' + two(d.getMonth() + 1) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
    }

    function isUnreached(lead) {
      var retry = (state.board && state.board.retryStatuses) || [150, 70];
      return retry.indexOf(lead.status) !== -1;
    }

    function statusClass(status) {
      if (status === 150 || status === 30 || status === 220 || status === 500) return 'bad';
      if (status === 100) return 'good';
      if (status === 1 || status === 10 || status === 20 || status === 40) return 'wait';
      return '';
    }

    /* ---------- טעינה ---------- */

    function loadCampaigns() {
      google.script.run
        .withSuccessHandler(function (campaigns) {
          state.campaigns = campaigns || [];
          var select = el('campaignSelect');
          if (!state.campaigns.length) {
            select.innerHTML = '<option>לא נמצאו קמפיינים בפרלה</option>';
            el('loading').textContent = 'לא נמצאו קמפיינים בחשבון פרלה.';
            return;
          }
          select.innerHTML = state.campaigns.map(function (c) {
            return '<option value="' + esc(c.id) + '">' + esc(c.name) + (c.active ? '' : ' (מושבת)') + '</option>';
          }).join('');
          state.pearlId = state.campaigns[0].id;
          loadBoard();
        })
        .withFailureHandler(function (err) {
          el('loading').textContent = 'שגיאה בטעינת הקמפיינים: ' + (err && err.message ? err.message : err);
        })
        .getPearlCampaigns(PEARL_KEY);
    }

    function loadBoard() {
      if (!state.pearlId) return;
      state.busy = true;
      state.picked = {};
      el('loading').style.display = '';
      el('loading').textContent = 'טוען מפרלה...';
      el('empty').style.display = 'none';
      el('tableBody').innerHTML = '';

      google.script.run
        .withSuccessHandler(function (board) {
          state.busy = false;
          state.board = board;
          state.leads = board.leads || [];
          state.statusFilter = null;
          state.tagFilter = null;
          el('loading').style.display = 'none';
          el('updatedAt').textContent = 'עודכן ' + formatDate(board.updatedAt);
          renderStats();
          renderFilters();
          render();
          if (board.truncated) toast('מוצגים ' + state.leads.length + ' הלידים האחרונים בקמפיין.');
        })
        .withFailureHandler(function (err) {
          state.busy = false;
          el('loading').textContent = 'שגיאה בטעינה מפרלה: ' + (err && err.message ? err.message : err);
        })
        .getPearlBoard(PEARL_KEY, state.pearlId);
    }

    /* ---------- קוביות ומסננים ---------- */

    function countBy(predicate) {
      var n = 0;
      state.leads.forEach(function (lead) { if (predicate(lead)) n++; });
      return n;
    }

    function renderStats() {
      var total = state.leads.length;
      var unreached = countBy(isUnreached);
      var waiting = countBy(function (l) {
        return l.status === 1 || l.status === 10 || l.status === 20 || l.status === 40;
      });
      var talked = countBy(function (l) {
        return l.status === 100 || l.status === 110 || l.status === 130;
      });

      el('stats').innerHTML =
        tile('סה"כ לידים בקמפיין', total, '', '') +
        tile('לא ענו - אפשר להחזיר לחיוג', unreached, 'לא הושגו + תא קולי', unreached > 0 ? 'hero' : '') +
        tile('ממתינים / בתור לחיוג', waiting, 'פרלה עוד תגיע אליהם', 'wait') +
        tile('שיחות שהתקיימו', talked, 'דיברה איתם בפועל', 'ok');
    }

    function tile(label, value, hint, cls) {
      return '<div class="stat ' + cls + '">' +
        '<div class="k">' + esc(label) + '</div>' +
        '<div class="v">' + value + '</div>' +
        '<div class="h">' + esc(hint) + '</div></div>';
    }

    function renderFilters() {
      var board = state.board || {};
      var counts = board.counts || {};
      var names = board.statusNames || {};
      var html = '';

      Object.keys(counts)
        .sort(function (a, b) { return counts[b] - counts[a]; })
        .forEach(function (code) {
          var on = String(state.statusFilter) === String(code);
          html += '<button type="button" class="chip' + (on ? ' on' : '') + '" data-status="' + esc(code) + '">' +
            esc(names[code] || ('סטטוס ' + code)) + '<span class="n">' + counts[code] + '</span></button>';
        });

      var tags = board.tags || [];
      if (tags.length) {
        html += '<div class="sep"></div>';
        tags.slice(0, 8).forEach(function (tag) {
          var on = state.tagFilter === tag;
          html += '<button type="button" class="chip tag' + (on ? ' on' : '') + '" data-tag="' + esc(tag) + '">' +
            esc(tag) + '<span class="n">' + (board.tagCounts[tag] || 0) + '</span></button>';
        });
      }

      el('filters').innerHTML = html;

      Array.prototype.forEach.call(el('filters').querySelectorAll('[data-status]'), function (chip) {
        chip.addEventListener('click', function () {
          var code = Number(chip.getAttribute('data-status'));
          state.statusFilter = (state.statusFilter === code) ? null : code;
          renderFilters();
          render();
        });
      });
      Array.prototype.forEach.call(el('filters').querySelectorAll('[data-tag]'), function (chip) {
        chip.addEventListener('click', function () {
          var tag = chip.getAttribute('data-tag');
          state.tagFilter = (state.tagFilter === tag) ? null : tag;
          renderFilters();
          render();
        });
      });
    }

    /* ---------- טבלה ---------- */

    function visibleLeads() {
      var search = state.search.trim().toLowerCase();
      return state.leads.filter(function (lead) {
        if (state.statusFilter !== null && lead.status !== state.statusFilter) return false;
        if (state.tagFilter && lead.tags.indexOf(state.tagFilter) === -1) return false;
        if (search) {
          var haystack = (lead.phone + ' ' + lead.name + ' ' + lead.summary).toLowerCase();
          if (haystack.indexOf(search) === -1) return false;
        }
        return true;
      });
    }

    function render() {
      var rows = visibleLeads();
      var html = rows.map(function (lead) {
        var isPicked = !!state.picked[lead.id];
        var tagHtml = lead.tags.length
          ? '<span class="pill tag">' + esc(lead.tags[0]) + '</span>'
          : '<span class="muted">—</span>';
        return '<tr class="' + (isPicked ? 'picked' : '') + '" data-id="' + esc(lead.id) + '">' +
          '<td class="c-pick"><input type="checkbox" data-pick="' + esc(lead.id) + '"' + (isPicked ? ' checked' : '') + '></td>' +
          '<td class="phone">' + esc(lead.phone) + '</td>' +
          '<td>' + (lead.name ? esc(lead.name) : '<span class="muted">—</span>') + '</td>' +
          '<td><span class="pill ' + statusClass(lead.status) + '">' + esc(lead.statusName) + '</span></td>' +
          '<td class="c-tag">' + tagHtml + '</td>' +
          '<td>' + (lead.attempts || '<span class="muted">—</span>') + '</td>' +
          '<td class="muted">' + esc(formatDate(lead.lastCallAt)) + '</td>' +
          '<td class="c-sum muted" title="' + esc(lead.summary) + '">' +
            (lead.summary ? esc(lead.summary) : '—') + '</td>' +
          '</tr>';
      }).join('');

      el('tableBody').innerHTML = html;
      el('empty').style.display = rows.length ? 'none' : '';

      Array.prototype.forEach.call(el('tableBody').querySelectorAll('[data-pick]'), function (box) {
        box.addEventListener('change', function () {
          var id = box.getAttribute('data-pick');
          if (box.checked) state.picked[id] = true;
          else delete state.picked[id];
          var tr = box.closest('tr');
          if (tr) tr.classList.toggle('picked', box.checked);
          syncPickState();
        });
      });

      syncPickState();
    }

    function pickedIds() { return Object.keys(state.picked); }

    function syncPickState() {
      var ids = pickedIds();
      el('pickCount').textContent = ids.length;
      el('resetBtn').disabled = ids.length === 0 || state.busy;
      el('resetBtn').textContent = ids.length ? '🔄 החזר לחדש (' + ids.length + ')' : '🔄 החזר לחדש';

      var rows = visibleLeads();
      var allPicked = rows.length > 0 && rows.every(function (lead) { return state.picked[lead.id]; });
      el('pickAll').checked = allPicked;
    }

    /* ---------- החזרה לחיוג ---------- */

    function openConfirm() {
      var ids = pickedIds();
      if (!ids.length) return;

      var byId = {};
      state.leads.forEach(function (lead) { byId[lead.id] = lead; });
      var chosen = ids.map(function (id) { return byId[id]; }).filter(Boolean);

      el('confirmTitle').textContent = chosen.length === 1
        ? 'להחזיר את הליד הזה לחיוג?'
        : 'להחזיר ' + chosen.length + ' לידים לחיוג?';

      el('confirmText').innerHTML = 'הלידים הבאים יחזרו לסטטוס <b>"חדש"</b> בפרלה:';

      el('confirmList').innerHTML = chosen.slice(0, 25).map(function (lead) {
        return '<div><span class="phone">' + esc(lead.phone) + '</span>' +
          '<span>' + esc(lead.name || '') + '</span>' +
          '<span class="pill ' + statusClass(lead.status) + '">' + esc(lead.statusName) + '</span></div>';
      }).join('') + (chosen.length > 25
        ? '<div class="muted">ועוד ' + (chosen.length - 25) + ' לידים...</div>'
        : '');

      var warn = el('confirmWarn');
      var max = (state.board && state.board.maxReset) || 300;
      if (chosen.length === 1) {
        warn.style.display = '';
        warn.textContent = 'טיפ: כדאי להתחיל מליד אחד ולוודא בפרלה שהוא באמת חזר לתור, לפני שמחזירים את כולם.';
      } else if (chosen.length > max) {
        warn.style.display = '';
        warn.textContent = 'נבחרו ' + chosen.length + ' לידים. בלחיצה אחת יוחזרו ' + max +
          ' הראשונים, והשאר יישארו מסומנים לפעם הבאה.';
      } else {
        warn.style.display = 'none';
      }

      el('confirmBack').classList.add('on');
    }

    function doReset() {
      var ids = pickedIds();
      el('confirmBack').classList.remove('on');
      state.busy = true;
      el('resetBtn').disabled = true;
      el('resetBtn').textContent = 'מחזיר לחיוג...';

      google.script.run
        .withSuccessHandler(function (result) {
          state.busy = false;
          var done = (result.done || []).length;
          var failed = result.failed || [];

          el('resultTitle').textContent = failed.length ? 'הוחזרו חלקית' : 'הוחזרו לחיוג ✓';
          var text = '<b>' + done + '</b> לידים חזרו לסטטוס "חדש" בפרלה.';
          if (result.remaining) {
            text += '<br>נותרו ' + result.remaining + ' לידים מסומנים - אפשר ללחוץ שוב.';
          }
          if (failed.length) {
            text += '<br>' + failed.length + ' לידים לא התקבלו על ידי פרלה:';
          }
          el('resultText').innerHTML = text;
          el('resultErr').textContent = failed.slice(0, 5).map(function (f) {
            return f.id + ': ' + f.error;
          }).join('\n');
          el('resultBack').classList.add('on');

          loadBoard();
        })
        .withFailureHandler(function (err) {
          state.busy = false;
          el('resultTitle').textContent = 'ההחזרה נכשלה';
          el('resultText').textContent = '';
          el('resultErr').textContent = (err && err.message ? err.message : String(err));
          el('resultBack').classList.add('on');
          syncPickState();
        })
        .resetPearlLeads(PEARL_KEY, state.pearlId, ids);
    }

    /* ---------- חיווט ---------- */

    el('campaignSelect').addEventListener('change', function () {
      state.pearlId = this.value;
      loadBoard();
    });

    el('refreshBtn').addEventListener('click', function () { loadBoard(); });

    el('searchInput').addEventListener('input', function () {
      state.search = this.value;
      render();
    });

    el('pickAll').addEventListener('change', function () {
      var checked = this.checked;
      visibleLeads().forEach(function (lead) {
        if (checked) state.picked[lead.id] = true;
        else delete state.picked[lead.id];
      });
      render();
    });

    el('pickUnreachedBtn').addEventListener('click', function () {
      state.leads.forEach(function (lead) {
        if (isUnreached(lead)) state.picked[lead.id] = true;
      });
      render();
      toast('סומנו ' + pickedIds().length + ' לידים שלא ענו');
    });

    el('clearPickBtn').addEventListener('click', function () {
      state.picked = {};
      render();
    });

    el('resetBtn').addEventListener('click', openConfirm);
    el('confirmCancel').addEventListener('click', function () {
      el('confirmBack').classList.remove('on');
    });
    el('confirmOk').addEventListener('click', doReset);
    el('resultOk').addEventListener('click', function () {
      el('resultBack').classList.remove('on');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        el('confirmBack').classList.remove('on');
        el('resultBack').classList.remove('on');
      }
    });

    loadCampaigns();
  })();
</script>
