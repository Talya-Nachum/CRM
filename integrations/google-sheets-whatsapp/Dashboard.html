    --surface-2: #ede3f7;
    --border: #ddc9ef;
    --text: #241934;
    --text-muted: #7c6b93;
    --accent: #6b2fa0;
    --accent-soft: #ead9f7;
    --accent-ink: #4a1f70;
    --good: #2f9e52;
    --good-soft: #e1f5e7;
    --bad: #d64545;
    --bad-soft: #fbe4e2;
    --pending: #d97f1f;
    --pending-soft: #fbedda;
    --shadow: 0 1px 2px rgba(74,31,112,0.08), 0 8px 24px -12px rgba(74,31,112,0.22);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1626;
      --surface: #241c33;
      --surface-2: #2e2440;
      --border: #3c2f52;
      --text: #ede6f7;
      --text-muted: #a697c2;
      --accent: #b07ee0;
      --accent-soft: #3a2a55;
      --accent-ink: #e4d3fb;
      --good: #5fc583;
      --good-soft: #1f3a2a;
      --bad: #e8776b;
      --bad-soft: #3a211e;
      --pending: #f0a94e;
      --pending-soft: #3a2a16;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Varela Round", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    direction: rtl;
    line-height: 1.5;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header.top h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  header.top .sub {
    color: var(--text-muted);
    font-size: 14px;
  }

  .brand-logo-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.01em;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo img {
    height: 40px;
    width: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface-2); }

  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .copy-toast {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }

  .copy-toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .copy-toast { transition: none; }
  }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .tab {
    flex: 0 0 auto;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stat-icon {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stat-icon svg { width: 20px; height: 20px; }

  .stat-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .stat .label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
  }

  .stat .value {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .stat .value.good { color: var(--good); }
  .stat .value.bad { color: var(--bad); }

  .stat .value.small {
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
  }

  .chart-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .legend {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  .legend-row .swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex: 0 0 auto;
  }

  .legend-row .name { flex: 1; color: var(--text-muted); }
  .legend-row .n { font-weight: 700; font-variant-numeric: tabular-nums; }

  .table-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
  }

  .search-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 640px;
  }

  thead th {
    text-align: right;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 700;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  tbody tr.row-new { background: var(--accent-soft); }
  tbody tr.row-new:hover { background: var(--accent-soft); }

  .new-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }

  .name-cell { font-weight: 600; }
  .phone-cell { font-variant-numeric: tabular-nums; color: var(--text-muted); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
  }

  .pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.pending { background: var(--pending-soft); color: var(--pending); }

  .reply-cell {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-muted);
  }

  .empty-state, .loading-state {
    color: var(--text-muted);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 30, 0.45);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }

  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    width: 100%;
    max-width: 360px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .modal-card h3 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 800;
  }

  .modal-label {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 10px;
  }

  .modal-input {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    margin-top: 4px;
  }

  .modal-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .modal-error {
    color: var(--bad);
    font-size: 12.5px;
    font-weight: 700;
    min-height: 16px;
    margin-top: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }
</style>

<script>
  // הכתובת הציבורית האמיתית (/exec), מוזרקת מהשרת - לא סומכים על
  // window.location.href כי הדף רץ בתוך iframe מבודד בדומיין אחר.
  const BASE_URL = '<?!= baseUrl ?>';

  let currentData = null;
  let currentTabName = null;
  let rowSnapshots = {}; // { tabName: { phone: {reply, callResult} } } - לזיהוי "תגובה חדשה"
  const AUTO_REFRESH_MS = 30000;

  const ICONS = {
    leads: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
  };

  function loadTabs() {
    google.script.run.withSuccessHandler(renderTabs).withFailureHandler(showError).getCampaignNames();
  }

  function renderTabs(names) {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    if (!names || !names.length) {
      tabsEl.innerHTML = '<span class="empty-state">לא נמצא אף טאב קמפיין (חסרה עמודת "טלפון נייד")</span>';
      return;
    }

    // אם הכתובת הגיעה עם ?tab=<שם> (לינק ששותף מטאב ספציפי) - פותחים ישר בו.
    const requestedTab = new URLSearchParams(window.location.search).get('tab');
    const startTab = requestedTab && names.indexOf(requestedTab) !== -1 ? requestedTab : names[0];

    names.forEach(function (name) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (name === startTab ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        btn.classList.add('active');
        loadCampaign(name);
      });
      tabsEl.appendChild(btn);
    });
    loadCampaign(startTab);
  }

  function loadCampaign(name, silent) {
    currentTabName = name;
    if (!silent) {
      document.getElementById('chartTitle').textContent = 'פילוח סטטוס - ' + name;
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" class="loading-state">טוען נתונים...</td></tr>';
    }
    google.script.run.withSuccessHandler(renderCampaign).withFailureHandler(showError).getCampaignData(name);
  }

  function renderCampaign(data) {
    currentData = data;
    if (!data) return;

    markNewRows_(data);

    const daysLabel = data.daysActive === null || data.daysActive === undefined
      ? 'טרם הופעל' : data.daysActive + (data.daysActive === 1 ? ' יום' : ' ימים');

    const stats = [
      { label: 'סה"כ לידים בקמפיין', value: data.total, icon: 'leads', fg: 'var(--accent)', bg: 'var(--accent-soft)' },
      { label: 'הודעות וואטסאפ נשלחו', value: data.sent, cls: 'good', icon: 'chat', fg: 'var(--good)', bg: 'var(--good-soft)' },
      { label: 'תגובות התקבלו', value: data.replies, icon: 'reply', fg: 'var(--accent)', bg: 'var(--accent-soft)' },
      { label: 'שיחות בוצעו (סוכנת AI)', value: data.callsSent, icon: 'bot', fg: 'var(--pending)', bg: 'var(--pending-soft)' },
      { label: 'שגיאות שליחה', value: data.errors, cls: 'bad', icon: 'alert', fg: 'var(--bad)', bg: 'var(--bad-soft)' },
      { label: 'פעילות היום', value: data.activityToday || 0, icon: 'bolt', fg: 'var(--accent)', bg: 'var(--accent-soft)' },
      { label: 'ימי פעילות', value: daysLabel, cls: 'small', icon: 'calendar', fg: 'var(--text-muted)', bg: 'var(--surface-2)' }
    ];
    document.getElementById('stats').innerHTML = stats.map(function (s) {
      return '<div class="stat">' +
        '<div class="stat-icon" style="background:' + s.bg + ';color:' + s.fg + '">' + ICONS[s.icon] + '</div>' +
        '<div class="stat-body"><span class="label">' + s.label + '</span>' +
        '<span class="value ' + (s.cls || '') + '">' + s.value + '</span></div></div>';
    }).join('');

    document.getElementById('legend').innerHTML =
      '<div class="legend-row"><span class="swatch" style="background:var(--good)"></span><span class="name">נשלח וואטסאפ</span><span class="n">' + data.sent + '</span></div>' +
      '<div class="legend-row"><span class="swatch" style="background:var(--pending)"></span><span class="name">ממתין לשליחה</span><span class="n">' + data.pending + '</span></div>' +
      '<div class="legend-row"><span class="swatch" style="background:var(--bad)"></span><span class="name">שגיאה</span><span class="n">' + data.errors + '</span></div>';

    drawDonut(data.sent, data.pending, data.errors);

    document.getElementById('searchInput').value = '';
    renderRows(data.rows);
  }

  /**
   * משווה את השורות הנוכחיות לתמונת המצב האחרונה של אותו טאב (מהסשן הזה
   * בלבד) ומסמן ב-r._isNew שורות שקיבלו תשובה/תוצאת שיחה חדשה מאז.
   */
  function markNewRows_(data) {
    const prevSnap = rowSnapshots[currentTabName];
    const newSnap = {};
    data.rows.forEach(function (r) {
      newSnap[r.phone] = { reply: r.reply, callResult: r.callResult };
      if (prevSnap) {
        const prev = prevSnap[r.phone];
        const replyChanged = r.reply && (!prev || r.reply !== prev.reply);
        const callChanged = r.callResult && (!prev || r.callResult !== prev.callResult);
        r._isNew = !!(prev && (replyChanged || callChanged));
      }
    });
    rowSnapshots[currentTabName] = newSnap;
  }

  function renderRows(rows) {
    const tbody = document.getElementById('tableBody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="empty-state">לא נמצאו אנשי קשר</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      return '<tr class="' + (r._isNew ? 'row-new' : '') + '">' +
        '<td class="reply-cell">' + (r.company ? escapeHtml_(r.company) : '—') + '</td>' +
        '<td class="name-cell">' + escapeHtml_(r.name) + '</td>' +
        '<td class="reply-cell">' + (r.title ? escapeHtml_(r.title) : '—') + '</td>' +
        '<td class="phone-cell">' + escapeHtml_(r.phone) + '</td>' +
        '<td class="reply-cell">' + (r.email ? escapeHtml_(r.email) : '—') + '</td>' +
        '<td class="reply-cell">' + (r.source ? escapeHtml_(r.source) : '—') + '</td>' +
        '<td>' + pill_(r.status, r.statusClass, 'ממתין') + '</td>' +
        '<td class="reply-cell">' + (r.firstReply ? escapeHtml_(r.firstReply) : '—') + '</td>' +
        '<td class="reply-cell" title="' + (r.reply ? escapeHtml_(r.reply) : '') + '">' + (r.reply ? escapeHtml_(lastReplyLine_(r.reply)) : '—') + (r._isNew && r.reply ? '<span class="new-badge">חדש</span>' : '') + '</td>' +
        '<td>' + pill_(r.callStatus, r.callStatusClass, '—') + '</td>' +
        '<td class="reply-cell">' + (r.callResult ? escapeHtml_(r.callResult) : '—') + (r._isNew && r.callResult ? '<span class="new-badge">חדש</span>' : '') + '</td>' +
        '</tr>';
    }).join('');
  }

  function pill_(value, cls, emptyLabel) {
    const label = value ? escapeHtml_(value) : emptyLabel;
    return '<span class="pill ' + cls + '">' + label + '</span>';
  }

  function escapeHtml_(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /**
   * מציגה בטבלה רק את שורת התשובה האחרונה (לא את כל השרשור), כדי שהתא
   * לא יהיה עמוס - ההיסטוריה המלאה עדיין נשמרת בגיליון עצמו ומיוצאת
   * במלואה בייצוא לאקסל (ראו setupExport_, שמשתמש ב-r.reply המלא).
   */
  function lastReplyLine_(text) {
    const lines = String(text).split('\n').filter(function (l) { return l.trim(); });
    return lines.length ? lines[lines.length - 1] : '';
  }

  /**
   * מסירה מתחילת השורה את חותמת הזמן שהצטרפות ההודעות מוסיפה (למשל
   * "17:28 15/07 - ") - כדי שבייצוא לאקסל התשובה עצמה תהיה ערך נקי
   * לסינון, בעוד שהתאריך/שעה מיוצאים בעמודה נפרדת (r.replyDate).
   */
  function stripTimestampPrefix_(line) {
    return String(line).replace(/^\d{2}:\d{2} \d{2}\/\d{2} - /, '');
  }

  function setupSearch_() {
    document.getElementById('searchInput').addEventListener('input', function (e) {
      if (!currentData) return;
      const q = e.target.value.trim().toLowerCase();
      const filtered = !q ? currentData.rows : currentData.rows.filter(function (r) {
        return String(r.name || '').toLowerCase().indexOf(q) !== -1 ||
          String(r.phone || '').toLowerCase().indexOf(q) !== -1;
      });
      renderRows(filtered);
    });
  }

  function setupExport_() {
    document.getElementById('exportBtn').addEventListener('click', function () {
      if (!currentData) return;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const rows = !q ? currentData.rows : currentData.rows.filter(function (r) {
        return String(r.name || '').toLowerCase().indexOf(q) !== -1 ||
          String(r.phone || '').toLowerCase().indexOf(q) !== -1;
      });

      // "תשובת לקוח" בגיליון היא שרשור מצטבר של כל ההודעות עם חותמות זמן
      // בתוך התא - לא ניתן לסינון נקי באקסל. לכן בייצוא מפרידים לשתי
      // עמודות: תאריך/שעה של התשובה האחרונה (ערך תאריך אמיתי, ניתן למיון/
      // סינון), והתשובה האחרונה עצמה בלי חותמת הזמן המוטמעת.
      const headers = ['שם חברה', 'שם איש קשר', 'תפקיד', 'טלפון נייד', 'אימייל', 'מקור ליד', 'סטטוס', 'תגובה ראשונית', 'תאריך ושעת תשובה', 'תשובת לקוח', 'סטטוס שיחה', 'תוצאות שיחה'];
      const cell_ = function (v) { return '<td>' + escapeHtml_(v === undefined || v === null ? '' : v) + '</td>'; };
      const headRow = '<tr>' + headers.map(function (h) { return '<th>' + escapeHtml_(h) + '</th>'; }).join('') + '</tr>';
      const bodyRows = rows.map(function (r) {
        const cleanReply = r.reply ? stripTimestampPrefix_(lastReplyLine_(r.reply)) : '';
        return '<tr>' + [r.company, r.name, r.title, r.phone, r.email, r.source, r.status, r.firstReply, r.replyDate, cleanReply, r.callStatus, r.callResult].map(cell_).join('') + '</tr>';
      }).join('');

      // "אקסל" אמיתי (xlsx) דורש ספרייה חיצונית שלא ניתן לטעון כאן; טבלת HTML
      // עם סיומת .xls נפתחת ישירות באקסל כגליון אלקטרוני רגיל, כולל עברית.
      const html = '<html><head><meta charset="UTF-8"></head><body dir="rtl">' +
        '<table border="1"><thead>' + headRow + '</thead><tbody>' + bodyRows + '</tbody></table>' +
        '</body></html>';

      const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (currentTabName || 'קמפיין') + '.xls';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  function setupAddContact_() {
    const modal = document.getElementById('addModal');
    const companyInput = document.getElementById('addCompany');
    const nameInput = document.getElementById('addName');
    const titleInput = document.getElementById('addTitle');
    const phoneInput = document.getElementById('addPhone');
    const emailInput = document.getElementById('addEmail');
    const sourceInput = document.getElementById('addSource');
    const errorEl = document.getElementById('addError');
    const saveBtn = document.getElementById('addSaveBtn');
    const allInputs = [companyInput, nameInput, titleInput, phoneInput, emailInput, sourceInput];

    function openModal() {
      document.getElementById('addModalTab').textContent = currentTabName || '';
      allInputs.forEach(function (input) { input.value = ''; });
      errorEl.textContent = '';
      modal.classList.add('show');
      companyInput.focus();
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function save() {
      const phone = phoneInput.value.trim();
      if (!phone) {
        errorEl.textContent = 'חובה להזין מספר טלפון';
        return;
      }
      if (!currentTabName) {
        errorEl.textContent = 'לא נבחר קמפיין';
        return;
      }
      const fields = {
        company: companyInput.value.trim(),
        name: nameInput.value.trim(),
        title: titleInput.value.trim(),
        phone: phone,
        email: emailInput.value.trim(),
        source: sourceInput.value.trim()
      };
      saveBtn.disabled = true;
      errorEl.textContent = '';
      google.script.run
        .withSuccessHandler(function () {
          saveBtn.disabled = false;
          closeModal();
          loadCampaign(currentTabName);
        })
        .withFailureHandler(function (err) {
          saveBtn.disabled = false;
          errorEl.textContent = 'שגיאה: ' + (err.message || err);
        })
        .addContact(currentTabName, fields);
    }

    document.getElementById('addContactBtn').addEventListener('click', openModal);
    document.getElementById('addCancelBtn').addEventListener('click', closeModal);
    saveBtn.addEventListener('click', save);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    phoneInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  }

  function setupShare_() {
    document.getElementById('shareBtn').addEventListener('click', function () {
      const url = currentTabName ? BASE_URL + '?tab=' + encodeURIComponent(currentTabName) : BASE_URL;
      const toast = document.getElementById('copyToast');
      const showToast = function () {
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showToast).catch(function () { legacyCopy_(url); showToast(); });
      } else {
        legacyCopy_(url);
        showToast();
      }
    });
  }

  function legacyCopy_(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  function showError(err) {
    document.getElementById('tabs').innerHTML = '<span class="empty-state">שגיאה בטעינת הנתונים: ' + escapeHtml_(err.message || err) + '</span>';
  }

  function drawDonut(sent, pending, errors) {
    const canvas = document.getElementById('donut');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 220;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const styles = getComputedStyle(document.documentElement);
    const good = styles.getPropertyValue('--good').trim();
    const pendingColor = styles.getPropertyValue('--pending').trim();
    const bad = styles.getPropertyValue('--bad').trim();
    const text = styles.getPropertyValue('--text').trim();
    const textMuted = styles.getPropertyValue('--text-muted').trim();

    const data = [
      { v: sent, c: good },
      { v: pending, c: pendingColor },
      { v: errors, c: bad }
    ];
    const total = data.reduce(function (s, d) { return s + d.v; }, 0) || 1;

    const cx = size / 2, cy = size / 2, rOuter = 92, rInner = 60;
    let start = -Math.PI / 2;

    ctx.clearRect(0, 0, size, size);

    data.forEach(function (seg) {
      if (!seg.v) return;
      const angle = (seg.v / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, rOuter, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = seg.c;
      ctx.fill();
      start += angle;
    });

    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = text;
    ctx.font = '800 26px "Segoe UI", Arial, sans-serif';
    ctx.fillText(Math.round((sent / total) * 100) + '%', cx, cy - 6);
    ctx.fillStyle = textMuted;
    ctx.font = '600 11px "Segoe UI", Arial, sans-serif';
    ctx.fillText('נשלחו בהצלחה', cx, cy + 16);
  }

  loadTabs();
  setupSearch_();
  setupExport_();
  setupAddContact_();
  setupShare_();

  // רענון אוטומטי: כל 30 שניות טוענים מחדש את נתוני הטאב הפעיל (בלי לגעת
  // ברשימת הטאבים עצמה, כדי לא "לקפוץ" למשתמש בזמן שהוא מסתכל).
  setInterval(function () {
    if (currentTabName) loadCampaign(currentTabName, true);
  }, AUTO_REFRESH_MS);
</script>
