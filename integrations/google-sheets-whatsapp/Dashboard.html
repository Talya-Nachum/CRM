      --accent-grad-2: #2E7DFF;
      --accent-soft: #1B2A42;
      --accent-ink: #BCD6FF;
      --accent-2: #A392FF;
      --accent-2-soft: #241F3D;
      --good: #34D399;
      --good-soft: #10291B;
      --bad: #F87171;
      --bad-soft: #341714;
      --pending: #FBBF24;
      --pending-soft: #332507;
      --cat-1: #3987e5;
      --cat-2: #008300;
      --cat-3: #d55181;
      --cat-4: #c98500;
      --cat-5: #199e70;
      --cat-6: #d95926;
      --cat-muted: #6f7685;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
      --shadow-hover: 0 1px 2px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 6px 6px, rgba(124,58,237,0.10) 1.4px, transparent 1.4px) top right / 22px 22px,
      linear-gradient(150deg, var(--bg) 0%, var(--bg-2) 100%);
    background-repeat: repeat, no-repeat;
    background-attachment: fixed;
    color: var(--text);
    font-family: "Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    direction: rtl;
    line-height: 1.5;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background:
        radial-gradient(circle at 6px 6px, rgba(167,139,250,0.14) 1.4px, transparent 1.4px) top right / 22px 22px,
        linear-gradient(150deg, var(--bg) 0%, var(--bg-2) 100%);
      background-repeat: repeat, no-repeat;
      background-attachment: fixed;
    }
  }

  .shell {
    display: flex;
    align-items: flex-start;
  }

  .sidebar {
    width: 232px;
    flex-shrink: 0;
    min-height: 100vh;
    background: var(--surface-2);
    border-left: 1px solid var(--border);
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 6px 6px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }

  .sidebar-brand-text {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .sidebar-section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 0 6px;
  }

  .page {
    flex: 1;
    min-width: 0;
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 28px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: relative;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 8px;
  }

  header.top h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  header.top .sub {
    color: var(--text-muted);
    font-size: 15px;
    margin-top: 4px;
  }

  .brand-logo-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.01em;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo img {
    height: 40px;
    width: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .btn:hover { background: var(--surface-2); transform: translateY(-1px); }

  .btn-accent {
    background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(109,40,217,0.45);
  }

  .btn-accent:hover {
    box-shadow: 0 10px 26px -6px rgba(109,40,217,0.55);
    transform: translateY(-1px);
  }

  .copy-toast {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }

  .copy-toast.show { opacity: 1; }

  .save-toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .save-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .copy-toast, .save-toast, .stat, .card, .btn, .tab, .search-input, tbody tr {
      transition: none;
    }
    .stat:hover, .card:hover, .btn:hover, .tab:hover {
      transform: none;
    }
  }

  .tabs {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    min-height: 0;
  }

  .tab {
    flex: 0 0 auto;
    width: 100%;
    text-align: right;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab:hover {
    background: var(--surface);
    color: var(--text);
  }

  .tab.active {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent-ink);
    font-weight: 700;
    box-shadow: inset -3px 0 0 0 var(--accent);
  }

  .tab.active:hover { color: var(--accent-ink); }

  @media (max-width: 780px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-height: auto;
      position: static;
      border-left: none;
      border-bottom: 1px solid var(--border);
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .sidebar-section-label { display: none; }
    .tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .tab.active { box-shadow: inset 0 -3px 0 0 var(--accent); }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr) 1.6fr;
    gap: 14px;
  }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .chart-tile { grid-column: 1 / -1; }
  }

  @media (max-width: 460px) {
    .stats { grid-template-columns: 1fr; }
  }

  .stat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .stat:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .stat-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .stat-icon svg { width: 22px; height: 22px; }

  .stat-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .stat .label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .stat .value {
    font-size: 27px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .stat .value.good { color: var(--good); }
  .stat .value.bad { color: var(--bad); }

  .stat .value.small {
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .stat .delta {
    font-size: 11.5px;
    font-weight: 700;
  }

  .stat-bar {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .table-card {
    border-radius: var(--radius-lg);
    padding: 26px 28px;
    margin-top: 14px;
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
  }

  /* גרף הפילוח - תא רחב בתוך שורת הסטטיסטיקה עצמה (לא כרטיס נפרד למטה),
     כדי שלא יגזול מקום/יגרום לגלילה - ר' בקשת הלקוחה. */
  .chart-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .chart-tile:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .chart-tile canvas { flex-shrink: 0; }

  .chart-tile-title {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .chart-legend {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 2px 4px;
    margin: 0 -4px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .legend-row:hover { background: var(--surface-2); }

  .legend-row.active {
    background: var(--accent-soft);
    font-weight: 700;
  }

  .legend-row.active .name { color: var(--accent-ink); }

  .legend-row .swatch {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .legend-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
  .legend-row .n { font-weight: 700; font-variant-numeric: tabular-nums; }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 700;
  }

  .filter-chip button {
    border: none;
    background: none;
    color: inherit;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }


  .table-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 10px 16px;
    border-radius: var(--radius-input);
    border: 1.5px solid var(--border);
    background: var(--bg-solid);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .table-scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 640px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: right;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 700;
    padding: 10px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .th-inner { display: inline-flex; align-items: center; gap: 5px; }

  .sortable-th .th-inner { cursor: pointer; user-select: none; }
  .sortable-th .th-inner:hover { color: var(--accent); }
  .th-inner.sort-active { color: var(--accent-ink); }

  .col-sort-icon {
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .th-inner.sort-active .col-sort-icon { color: var(--accent); opacity: 1; }

  .col-filter-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 4px;
    font-size: 9px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .col-filter-icon:hover { background: var(--surface-2); }
  .col-filter-icon.on { background: var(--accent); color: #fff; }

  .filter-pop {
    position: absolute;
    width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-hover);
    padding: 12px;
    z-index: 50;
    font-size: 12.5px;
  }

  .filter-pop .fp-title { font-weight: 800; margin-bottom: 8px; }

  .filter-pop .fp-actions {
    display: flex;
    justify-content: space-between;
    color: var(--accent);
    font-weight: 700;
    font-size: 11.5px;
    margin-bottom: 6px;
    cursor: pointer;
  }

  .filter-pop .fp-list {
    max-height: 170px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .filter-pop label { display: flex; align-items: center; gap: 7px; font-weight: 400; }

  .filter-pop .fp-apply {
    margin-top: 10px;
    width: 100%;
    padding: 7px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }

  .note-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .add-note-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px dashed var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .action-btns { display: inline-flex; gap: 5px; }

  .ai-summary-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--accent-2);
    background: var(--accent-2-soft);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  tbody td {
    padding: 13px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: var(--surface-2); }

  tbody tr.row-new { background: var(--accent-soft); }
  tbody tr.row-new:hover { background: var(--accent-soft); }

  .new-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }

  .name-cell { font-weight: 600; }
  .phone-cell { font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .date-cell { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12.5px; white-space: nowrap; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--text-muted);
    flex-wrap: wrap;
    gap: 10px;
  }

  .pagination .pages { display: flex; gap: 6px; align-items: center; }

  .pagination button {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }

  .pagination button:disabled { opacity: 0.4; cursor: default; }

  .pagination button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .pagination .ellipsis { padding: 0 2px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
  }

  .pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .pill.good { background: var(--good-soft); color: var(--good); }

  /* תגית סטטוס צבעונית לפי colorForStatus_ - צבע ייחודי לכל סטטוס, לא רק ירוק/אדום/כתום */
  .status-pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.pending { background: var(--pending-soft); color: var(--pending); }

  .reply-cell {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-muted);
  }

  .empty-state, .loading-state {
    color: var(--text-muted);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 30, 0.45);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }

  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    width: 100%;
    max-width: 360px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .modal-card h3 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 800;
  }

  .modal-label {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 10px;
  }

  .modal-input {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    margin-top: 4px;
  }

  .modal-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .modal-error {
    color: var(--bad);
    font-size: 12.5px;
    font-weight: 700;
    min-height: 16px;
    margin-top: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }

  .crm-modal-card { max-width: 420px; }

  .modal-sub {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .crm-current-status {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    margin-top: 4px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12.5px;

    <select class="modal-input" id="crmUser"></select>

    <label class="modal-label">עדכון סטטוס</label>
    <input type="text" class="modal-input" id="crmStatusText" placeholder="סטטוס חדש, למשל: טופל">

    <label class="modal-label">הערות</label>
    <textarea class="modal-input crm-note-history-readonly" id="crmNoteHistory" readonly placeholder="אין הערות עדיין"></textarea>
    <textarea class="modal-input crm-note-input" id="crmNoteText" placeholder="לכתוב הערה חדשה..."></textarea>

    <div class="modal-error" id="crmError"></div>

    <div class="modal-actions">
      <button class="btn" id="crmCloseBtn" type="button">סגירה</button>
      <button class="btn btn-accent" id="crmSaveBtn" type="button">שמור וסגור</button>
    </div>
  </div>
</div>

<div class="save-toast" id="saveToast">✓ נשמר</div>

<script>
  // הכתובת הציבורית האמיתית (/exec), מוזרקת מהשרת - לא סומכים על
  // window.location.href כי הדף רץ בתוך iframe מבודד בדומיין אחר.
  const BASE_URL = '<?!= baseUrl ?>';

  let currentData = null;
  let currentTabName = null;
  let rowSnapshots = {}; // { tabName: { phone: {reply, callResult} } } - לזיהוי "תגובה חדשה"
  let visibleColumns = []; // מחושב מחדש בכל טעינת קמפיין - ראו computeVisibleColumns_
  let currentPage = 1;
  let currentRows = []; // רשימת השורות המלאה (אחרי סינון) שעליה מבוססת הדפדוף
  let activeCategoryFilter = null; // { kind: 'named'|'other'|'noreply', label } - סינון לפי לחיצה על פילוח התגובות
  let currentBreakdown = []; // הפילוח האחרון שצויר, לצורך סימון השורה הפעילה בלג'נד
  let namedCategoryLabels = []; // תוויות הקטגוריות "האמיתיות" (לא "אחר"/"טרם ענו") - לחישוב סינון "אחר"
  let columnFilters = {}; // { columnKey: Set(ערכים מותרים) } - סינון לפי עמודה (כמו Excel)
  let sortState = { key: null, dir: 1 }; // מיון א-ב בלחיצה על כותרת עמודה - ר' setupColumnSortClicks_
  const PAGE_SIZE = 10;
  const AUTO_REFRESH_MS = 30000;

  const ICONS = {
    leads: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.36a9.87 9.87 0 0 0 4.62 1.15h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.35-.5.05-1.13.07-1.82-.11-.42-.11-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.26-.29.58-.36.77-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .9 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.14-.28.29-.12.56.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.63-.14.26.1 1.65.78 1.93.92.28.14.47.21.54.33.07.12.07.68-.17 1.36z"/></svg>',
    reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg>'
  };

  function loadTabs() {
    google.script.run.withSuccessHandler(renderTabs).withFailureHandler(showError).getCampaignNames();
  }

  function renderTabs(names) {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    if (!names || !names.length) {
      tabsEl.innerHTML = '<span class="empty-state">לא נמצא אף טאב קמפיין (חסרה עמודת "טלפון נייד")</span>';
      return;
    }

    // אם הכתובת הגיעה עם ?tab=<שם> (לינק ששותף מטאב ספציפי) - פותחים ישר בו.
    const requestedTab = new URLSearchParams(window.location.search).get('tab');
    const startTab = requestedTab && names.indexOf(requestedTab) !== -1 ? requestedTab : names[0];

    names.forEach(function (name) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (name === startTab ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        btn.classList.add('active');
        loadCampaign(name);
      });
      tabsEl.appendChild(btn);
    });
    loadCampaign(startTab);
  }

  function loadCampaign(name, silent) {
    currentTabName = name;
    if (!silent) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" class="loading-state">טוען נתונים...</td></tr>';
    }
    google.script.run
      .withSuccessHandler(function (data) { renderCampaign(data, silent); })
      .withFailureHandler(showError)
      .getCampaignData(name);
  }

  function renderCampaign(data, silent) {
    currentData = data;
    if (!data) return;

    customStatusColors = data.statusColors || {};
    markNewRows_(data);

    const sentPct = data.total ? Math.round((data.sent / data.total) * 100) : 0;
    const callsPct = data.total ? Math.round((data.callsSent / data.total) * 100) : 0;
    const replyRate = data.sent ? Math.round((data.replies / data.sent) * 100) : 0;

    const stats = [
      { label: 'סה"כ לידים בקמפיין', value: data.total, icon: 'leads', fg: 'var(--accent)', bg: 'var(--accent-soft)' },
      { label: 'הודעות וואטסאפ נשלחו', value: data.sent, cls: 'good', icon: 'whatsapp', fg: '#25D366', bg: 'rgba(37,211,102,.14)', delta: sentPct + '% מהלידים' },
      { label: 'תגובות התקבלו', value: data.replies, icon: 'reply', fg: 'var(--accent-2)', bg: 'var(--accent-2-soft)', delta: replyRate + '% מהשליחות' },
      { label: 'שיחות פרלה', value: data.callsSent, icon: 'bot', fg: 'var(--pending)', bg: 'var(--pending-soft)', delta: callsPct + '% מהלידים' }
    ];
    const statsHtml = stats.map(function (s) {
      const delta = s.delta ? '<div class="delta" style="color:' + s.fg + '">' + s.delta + '</div>' : '';
      return '<div class="stat">' +
        '<div class="stat-icon" style="background:' + s.bg + ';color:' + s.fg + '">' + ICONS[s.icon] + '</div>' +
        '<div class="stat-body"><span class="label">' + s.label + '</span>' +
        '<span class="value ' + (s.cls || '') + '">' + s.value + '</span>' + delta + '</div>' +
        '<div class="stat-bar" style="background:' + s.fg + '"></div></div>';
    }).join('');
    // גרף הפילוח יושב בתוך שורת הסטטיסטיקה עצמה (תא רחב יותר בסוף השורה)
    // כדי שלא יתפוס עוד שורה נפרדת ולא יגרום לגלילה - במקום שתי הקוביות
    // "שגיאות שליחה"/"ימי פעילות" שהיו כאן קודם (עדיין מחושבות בשרת,
    // פשוט לא מוצגות כאן; אפשר למצוא אותן ב-console/getCampaignData אם צריך).
    const chartTileHtml =
      '<div class="chart-tile">' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="chart-tile-title" id="chartTitle">פילוח תגובות</div>' +
          '<div class="chart-legend" id="legend"></div>' +
        '</div>' +
        '<canvas id="donut" width="70" height="70" role="img"></canvas>' +
      '</div>';
    document.getElementById('stats').innerHTML = statsHtml + chartTileHtml;

    const breakdown = colorizeBreakdown_(data.replyBreakdown || []);
    currentBreakdown = breakdown;
    namedCategoryLabels = breakdown.filter(function (e) { return !e.muted && e.label !== 'אחר'; }).map(function (e) { return e.label; });
    document.getElementById('legend').innerHTML = breakdown.map(function (e, i) {
      return '<div class="legend-row" data-idx="' + i + '"><span class="swatch" style="background:' + e.color + '"></span><span class="name">' + escapeHtml_(e.label) + '</span><span class="n">' + e.count + '</span></div>';
    }).join('');
    setupLegendClicks_();
    drawBreakdown_(breakdown);

    // ממיינים כך שתשובות חדשות תמיד למעלה, אחריהן מי שכבר ענה, ולבסוף
    // מי שעדיין לא ענה בתחתית - כדי שהעין תלך ישר למה שדורש תשומת לב.
    // כותבים חזרה ל-data.rows (לא רק למשתנה מקומי) כדי שגם הסינון
    // (applyFilters_, שמסנן מתוך currentData.rows) יכבד את הסדר הזה.
    data.rows = data.rows.slice().sort(function (a, b) {
      const aNew = a._isNew ? 1 : 0, bNew = b._isNew ? 1 : 0;
      if (aNew !== bNew) return bNew - aNew;
      const aReplied = a.reply ? 1 : 0, bReplied = b.reply ? 1 : 0;
      return bReplied - aReplied;
    });

    visibleColumns = computeVisibleColumns_(data.rows);
    renderTableHead_(visibleColumns);

    // ברענון שקט (כל 30 שניות) שומרים על החיפוש, הסינון לפי קטגוריה,
    // והעמוד הנוכחיים - לא קופצים לה חזרה לעמוד 1 / מנקים סינון באמצע
    // צפייה. רק במעבר טאב (לא שקט) מתחילים מחדש בלי סינון.
    if (!silent) {
      document.getElementById('searchInput').value = '';
      activeCategoryFilter = null;
    }
    applyFilters_(!silent);
  }

  /**
   * משווה את השורות הנוכחיות לתמונת המצב האחרונה של אותו טאב (מהסשן הזה
   * בלבד) ומסמן ב-r._isNew שורות שקיבלו תשובה/תוצאת שיחה חדשה מאז.
   */
  function markNewRows_(data) {
    const prevSnap = rowSnapshots[currentTabName];
    const newSnap = {};
    data.rows.forEach(function (r) {
      newSnap[r.phone] = { reply: r.reply, callResult: r.callResult };
      if (prevSnap) {
        const prev = prevSnap[r.phone];
        const replyChanged = r.reply && (!prev || r.reply !== prev.reply);
        const callChanged = r.callResult && (!prev || r.callResult !== prev.callResult);
        r._isNew = !!(prev && (replyChanged || callChanged));
      }
    });
    rowSnapshots[currentTabName] = newSnap;
  }

  /**
   * הגדרת כל העמודות האפשריות בטבלה. עמודות עם always:true מוצגות
   * תמיד; שאר העמודות מוצגות רק אם יש לפחות שורה אחת עם ערך בהן
   * (ראו computeVisibleColumns_) - כדי לא להציג עמודות ריקות לגמרי.
   */
  const COLUMN_DEFS = [
    { key: 'company', label: 'שם חברה', always: true, sortable: true,
      filterValue: function (r) { return r.company || ''; },
      cell: function (r) { return '<td class="reply-cell">' + (r.company ? escapeHtml_(r.company) : '—') + '</td>'; } },
    { key: 'name', label: 'שם איש קשר', always: true, sortable: true,
      filterValue: function (r) { return r.name || ''; },
      cell: function (r) { return '<td class="name-cell">' + escapeHtml_(r.name) + '</td>'; } },
    { key: 'phone', label: 'טלפון נייד', always: true,
      filterValue: function (r) { return r.phone || ''; },
      cell: function (r) { return '<td class="phone-cell">' + escapeHtml_(r.phone) + '</td>'; } },
    { key: 'finalStatus', label: 'סטטוס', always: true, sortable: true,
      // רק לחיצה אמיתית על כפתור - לא תשובה חופשית (זו כבר מוצגת בעמודת
      // "הערות איש קשר"). כל עוד לא הגיעה תגובה כזו, נשאר הסטטוס הבסיסי
      // ("נשלח וואטסאפ" וכו') - וניתן לדריסה חופשית תמיד ע"י הצוות. לכל
      // סטטוס יש צבע קבוע/עקבי משלו (colorForStatus_) - לא רק ירוק/אדום.
      filterValue: function (r) { return r.firstReply || r.status || ''; },
      cell: function (r) {
        const statusText = r.firstReply || r.status || 'ממתין';
        const c = colorForStatus_(statusText);
        return '<td><span class="status-pill" style="background:' + softStatusColor_(c) + ';color:' + c + ';">' + escapeHtml_(statusText) + '</span></td>';
      } },
    { key: 'reply', label: 'הערות איש קשר', always: true,
      // שיחת הוואטסאפ עם הבוט (טקסט חופשי בלבד - לחיצת כפתור לבדה כבר
      // מתועדת ב"סטטוס" ולא משוכפלת לכאן). נפרדת מ"הערות מיטוב".
      filterValue: function (r) { return r.reply ? lastReplyLine_(r.reply) : ''; },
      cell: function (r) { return '<td class="reply-cell" title="' + (r.reply ? escapeHtml_(r.reply) : '') + '">' + (r.reply ? escapeHtml_(lastReplyLine_(r.reply)) : '—') + (r._isNew && r.reply ? '<span class="new-badge">חדש</span>' : '') + '</td>'; } },
    { key: 'notes', label: 'הערות מיטוב', always: true,
      // יומן הערות ידניות של הצוות בלבד (addUserNote/setUserStatus) -
      // נפרד מ"הערות איש קשר". התא מציג תקציר קצר (מי כתב אחרון + כמות) -
      // הטקסט המלא נפתח ב"+".
      filterValue: function (r) { return r.userNotes || ''; },
      cell: function (r) {
        const summary = parseNotesSummary_(r.userNotes);
        if (!summary) return '<td class="reply-cell">—</td>';
        return '<td><span class="note-chip" data-phone="' + escapeHtml_(r.phone) + '" title="' + escapeHtml_(r.userNotes) + '">📝 ' + escapeHtml_(summary.lastAuthor) + ' (' + summary.count + ')</span></td>';
      } },
    { key: 'date', label: 'תאריך', always: true, sortable: true,
      filterValue: function (r) { return r.replyDate || ''; },
      cell: function (r) { return '<td class="date-cell">' + (r.replyDate ? escapeHtml_(r.replyDate) : '—') + '</td>'; } },
    { key: 'actions', label: '', always: true,
      cell: function (r) {
        const p = escapeHtml_(r.phone);
        return '<td><div class="action-btns">' +
          '<button type="button" class="add-note-btn" data-phone="' + p + '" title="הערות וסטטוס">+</button>' +
          '<button type="button" class="ai-summary-btn" data-phone="' + p + '" title="סיכום AI">✨</button>' +
          '</div></td>';
      } }
  ];

  function computeVisibleColumns_(rows) {
    return COLUMN_DEFS.filter(function (col) {
      return col.always || rows.some(col.hasValue);
    });
  }

  function renderTableHead_(columns) {
    document.getElementById('tableHead').innerHTML = '<tr>' + columns.map(function (c) {
      const filterBtn = c.filterValue
        ? '<span class="col-filter-icon' + (columnFilters[c.key] ? ' on' : '') + '" data-key="' + c.key + '">▾</span>'
        : '';
      const sortArrow = c.sortable
        ? '<span class="col-sort-icon">' + (sortState.key === c.key ? (sortState.dir === 1 ? '▲' : '▼') : '⇅') + '</span>'
        : '';
      const sortCls = c.sortable ? ' class="sortable-th"' : '';
      const activeCls = c.sortable && sortState.key === c.key ? ' sort-active' : '';
      return '<th' + sortCls + '><span class="th-inner' + activeCls + '" data-sort-key="' + (c.sortable ? c.key : '') + '">' +
        escapeHtml_(c.label) + sortArrow + filterBtn + '</span></th>';
    }).join('') + '</tr>';
    setupColumnFilterClicks_(columns);
    setupColumnSortClicks_();
  }

  /**
   * מיון א-ב בלחיצה על כותרת עמודה (name/company/finalStatus/date) -
   * לחיצה נוספת על אותה עמודה הופכת כיוון (עולה/יורד), לחיצה על עמודה
   * אחרת מתחילה מיון חדש עולה. מוחל ב-getFilteredRows_ אחרי כל הסינונים.
   */
  function setupColumnSortClicks_() {
    document.querySelectorAll('#tableHead .th-inner[data-sort-key]').forEach(function (el) {
      const key = el.getAttribute('data-sort-key');
      if (!key) return;
      el.addEventListener('click', function (e) {
        if (e.target.closest('.col-filter-icon')) return;
        sortState = (sortState.key === key)
          ? { key: key, dir: sortState.dir * -1 }
          : { key: key, dir: 1 };
        renderTableHead_(visibleColumns);
        applyFilters_(true);
      });
    });
  }

  /**
   * מפענחת את "הערות משתמש" (שרשור שורות "שם - תאריך שעה: טקסט", החדשה
   * למעלה) לתקציר קצר לתא בטבלה - כמות ההערות ומי כתבה את האחרונה.
   */
  function parseNotesSummary_(notes) {
    if (!notes) return null;
    const lines = String(notes).split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return null;
    const match = lines[0].match(/^([^-]+)-/);
    return { count: lines.length, lastAuthor: match ? match[1].trim() : '' };
  }

  function renderRows(rows) {
    const tbody = document.getElementById('tableBody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="' + visibleColumns.length + '" class="empty-state">לא נמצאו אנשי קשר</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      return '<tr class="' + (r._isNew ? 'row-new' : '') + '">' +
        visibleColumns.map(function (c) { return c.cell(r); }).join('') +
        '</tr>';
    }).join('');
  }

  /**
   * מציגה עמוד אחד (10 שורות) מתוך הרשימה שהתקבלה, ומרנדרת מתחת לטבלה
   * את פס הדפדוף (עימוד). נקראת מחדש (עם אותה רשימה מלאה) בכל לחיצה
   * על מספר עמוד - כדי לא לשכפל את לוגיקת החיתוך בשני מקומות.
   */
  function renderTable_(rows) {
    currentRows = rows;
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageRows = rows.slice(startIdx, startIdx + PAGE_SIZE);
    renderRows(pageRows);
    renderPagination_(rows.length, totalPages, startIdx, pageRows.length);
  }

  function renderPagination_(totalCount, totalPages, startIdx, pageCount) {
    const el = document.getElementById('pagination');
    if (!totalCount) { el.innerHTML = ''; return; }

    const pagesHtml = pageNumbersToShow_(currentPage, totalPages).map(function (p) {
      return p === '...'
        ? '<span class="ellipsis">…</span>'
        : '<button type="button" class="' + (p === currentPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
    }).join('');

    el.innerHTML =
      '<span>מציג ' + (startIdx + 1) + '-' + (startIdx + pageCount) + ' מתוך ' + totalCount + '</span>' +
      '<div class="pages">' +
        '<button type="button" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + '>‹</button>' +
        pagesHtml +
        '<button type="button" data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + '>›</button>' +
      '</div>';

    el.querySelectorAll('button[data-page]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const p = parseInt(btn.getAttribute('data-page'), 10);
        if (!p || p < 1 || p > totalPages || p === currentPage) return;
        currentPage = p;
        renderTable_(currentRows);
      });
    });
  }

  /**
   * רשימת מספרי העמודים להציג בפס הדפדוף: עד 7 עמודים - כולם; יותר מזה -
   * עמוד ראשון, עמוד אחרון, והעמוד הנוכחי עם שכן מכל צד, עם "…" ביניהם.
   */
  function pageNumbersToShow_(current, total) {
    if (total <= 7) {
      const all = [];
      for (let i = 1; i <= total; i++) all.push(i);
      return all;
    }
    const result = [1];
    if (current > 3) result.push('...');
    const start = Math.max(2, current - 1);
    const end = Math.min(total - 1, current + 1);
    for (let i = start; i <= end; i++) result.push(i);
    if (current < total - 2) result.push('...');
    result.push(total);
    return result;
  }

  function pill_(value, cls, emptyLabel) {
    const label = value ? escapeHtml_(value) : emptyLabel;
    return '<span class="pill ' + cls + '">' + label + '</span>';
  }

  function escapeHtml_(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // סטטוסים שנחשבים "הצלחה אמיתית" (נקבעה פגישה) - רק הם מציגים קונפטי
  // בסיום "שמור וסגור"; כל שמירה אחרת מציגה רק ✓ קטן שמתפוגג, בלי חגיגה.
  const MEETING_STATUSES = ['תואמה פגישה מקוונת', 'תואמה פגישה פרונטלית'];

  /**
   * אפקט חגיגה (קונפטי) - מוצג רק כשקובעים פגישה (MEETING_STATUSES), לא
   * בכל שמירה. כמה ריבועים צבעוניים שנופלים ודוהים, בלי ספרייה חיצונית
   * (לא ניתן לטעון CDN כאן).
   */
  function fireConfetti_() {
    const colors = ['#7C3AED', '#A78BFA', '#34D399', '#FBBF24', '#F472B6'];
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
    document.body.appendChild(container);
    const count = 26;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      const size = 6 + Math.random() * 6;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const startX = 50 + (Math.random() * 30 - 15);
      const drift = (Math.random() * 60 - 30);
      const duration = 900 + Math.random() * 500;
      const rotation = Math.random() * 360;
      piece.style.cssText =
        'position:absolute;left:' + startX + 'vw;top:38vh;width:' + size + 'px;height:' + (size * 0.4) + 'px;' +
        'background:' + color + ';border-radius:2px;opacity:1;' +
        'transform:rotate(' + rotation + 'deg);' +
        'transition:transform ' + duration + 'ms ease-out, top ' + duration + 'ms ease-in, opacity ' + duration + 'ms ease-in;';
      container.appendChild(piece);
      (function (piece, drift, rotation, duration) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            piece.style.top = (38 + 25 + Math.random() * 15) + 'vh';
            piece.style.transform = 'translateX(' + drift + 'px) rotate(' + (rotation + 360 + Math.random() * 360) + 'deg)';
            piece.style.opacity = '0';
          });
        });
      })(piece, drift, rotation, duration);
    }
    setTimeout(function () { container.remove(); }, 1600);
  }

  let saveToastTimer_ = null;
  /**
   * הודעת "✓ נשמר" קטנה שמתפוגגת - מוצגת בכל שמירה שהיא לא קביעת פגישה
   * (ר' MEETING_STATUSES), כדי לא לחגוג עם קונפטי על כל עדכון סטטוס.
   */
  function showSavedToast_() {
    const toast = document.getElementById('saveToast');
    if (!toast) return;
    toast.classList.add('show');
    clearTimeout(saveToastTimer_);
    saveToastTimer_ = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  /**
   * מציגה בטבלה רק את שורת התשובה האחרונה (לא את כל השרשור), כדי שהתא
   * לא יהיה עמוס - ההיסטוריה המלאה עדיין נשמרת בגיליון עצמו ומיוצאת
   * במלואה בייצוא לאקסל (ראו setupExport_, שמשתמש ב-r.reply המלא).
   */
  function lastReplyLine_(text) {
    const lines = String(text).split('\n').filter(function (l) { return l.trim(); });
    return lines.length ? lines[lines.length - 1] : '';
  }

  /**
   * מסירה מתחילת השורה את חותמת הזמן שהצטרפות ההודעות מוסיפה (למשל
   * "17:28 15/07 - ") - כדי שבייצוא לאקסל התשובה עצמה תהיה ערך נקי
   * לסינון, בעוד שהתאריך/שעה מיוצאים בעמודה נפרדת (r.replyDate).
   */
  function stripTimestampPrefix_(line) {
    return String(line).replace(/^\d{2}:\d{2} \d{2}\/\d{2} - /, '');
  }

  function setupSearch_() {
    document.getElementById('searchInput').addEventListener('input', function () {
      applyFilters_(true);
    });
  }

  /**
   * מחילה יחד את סינון החיפוש (טקסט חופשי) ואת סינון הקטגוריה (לחיצה
   * על שורה בלג'נד של "פילוח תגובות") על השורות המלאות של הקמפיין,
   * ומרנדרת מחדש את הטבלה + הדפדוף + הלג'נד (סימון השורה הפעילה).
   */
  /**
   * מחשבת את השורות שנשארות אחרי כל הסינונים הפעילים (חיפוש + קטגוריה
   * + עמודות) - משמשת גם את applyFilters_ (לתצוגה בטבלה) וגם את
   * setupExport_ (כדי שהייצוא לאקסל יכבד בדיוק את מה שמסונן על המסך).
   */
  function getFilteredRows_() {
    if (!currentData) return [];
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let rows = !q ? currentData.rows : currentData.rows.filter(function (r) {
      return String(r.name || '').toLowerCase().indexOf(q) !== -1 ||
        String(r.phone || '').toLowerCase().indexOf(q) !== -1;
    });
    if (activeCategoryFilter) {
      rows = rows.filter(function (r) { return rowMatchesCategory_(r, activeCategoryFilter); });
    }
    Object.keys(columnFilters).forEach(function (key) {
      const allowed = columnFilters[key];
      const col = COLUMN_DEFS.filter(function (c) { return c.key === key; })[0];
      if (!allowed || !col) return;
      rows = rows.filter(function (r) { return allowed.has(String(col.filterValue(r))); });
    });
    if (sortState.key) {
      const sortCol = COLUMN_DEFS.filter(function (c) { return c.key === sortState.key; })[0];
      if (sortCol) {
        rows = rows.slice().sort(function (a, b) {
          const av = String(sortCol.filterValue(a) || '');
          const bv = String(sortCol.filterValue(b) || '');
          return av.localeCompare(bv, 'he') * sortState.dir;
        });
      }
    }
    return rows;
  }

  function applyFilters_(resetPage) {
    if (!currentData) return;
    if (resetPage) currentPage = 1;
    renderTable_(getFilteredRows_());
    renderActiveFilterChip_();
    renderLegendActiveState_();
  }

  /**
   * הקטגוריה של שורה - התגובה הראשונית אם יש, אחרת ההודעה הראשונה
   * בשרשור, אחרת ריק (= "טרם ענו"). זהה ללוגיקה שמחשבת את replyBreakdown_
   * בצד השרת (Code.gs), כדי שהלחיצה על הלג'נד תסנן בדיוק את מי שנספר
   * תחת אותה קטגוריה בגרף.
   */
  function categoryOf_(r) {
    return r.firstReply || (r.reply ? String(r.reply).split('\n')[0] : '') || '';
  }

  function rowMatchesCategory_(r, filter) {
    const cat = categoryOf_(r);
    if (filter.kind === 'noreply') return !cat;
    if (filter.kind === 'other') return !!cat && namedCategoryLabels.indexOf(cat) === -1;
    return cat === filter.label;
  }

  function setupLegendClicks_() {
    document.querySelectorAll('#legend .legend-row').forEach(function (row) {
      row.addEventListener('click', function () {
        const idx = parseInt(row.getAttribute('data-idx'), 10);
        const entry = currentBreakdown[idx];
        if (!entry) return;
        const kind = entry.muted ? 'noreply' : (entry.label === 'אחר' ? 'other' : 'named');
        const isSame = activeCategoryFilter && activeCategoryFilter.kind === kind && activeCategoryFilter.label === entry.label;
        activeCategoryFilter = isSame ? null : { kind: kind, label: entry.label };
        // מסירים סינון עמודה קיים על "סטטוס איש קשר" - אותה עמודה בדיוק
        // שהגרף מייצג - כדי שסינון ישן (למשל מבחירה קודמת בתיבת הסימונים)
        // לא יתנגש בשקט עם הקטגוריה החדשה שנלחצה ויחזיר "לא נמצאו" בטעות.
        delete columnFilters['finalStatus'];
        renderTableHead_(visibleColumns);
        applyFilters_(true);
      });
    });
  }

  /**
   * מציגה תמיד באופן בולט אם יש **כל** סינון פעיל (חיפוש, קטגוריה
   * מהלג'נד, או סינון עמודה) + כמה שורות מוצגות מתוך הסך הכול בקמפיין -
   * כדי שלעולם לא יקרה שסינון ישן ונשכח יגרום ל"חשבתי שראיתי הכל" בטעות.
   */
  function renderActiveFilterChip_() {
    const el = document.getElementById('activeFilterChip');
    if (!el || !currentData) return;
    const q = document.getElementById('searchInput').value.trim();
    const hasColumnFilters = Object.keys(columnFilters).some(function (k) { return !!columnFilters[k]; });
    if (!q && !activeCategoryFilter && !hasColumnFilters) { el.innerHTML = ''; return; }

    const shown = getFilteredRows_().length;
    const total = currentData.rows.length;
    el.innerHTML = '<span class="filter-chip">מציג ' + shown + ' מתוך ' + total + ' (יש סינון פעיל)' +
      ' <button type="button" id="clearAllFilters">נקה הכל ✕</button></span>';
    document.getElementById('clearAllFilters').addEventListener('click', function () {
      document.getElementById('searchInput').value = '';
      activeCategoryFilter = null;
      columnFilters = {};
      renderTableHead_(visibleColumns);
      applyFilters_(true);
    });
  }

  function renderLegendActiveState_() {
    document.querySelectorAll('#legend .legend-row').forEach(function (row) {
      const idx = parseInt(row.getAttribute('data-idx'), 10);
      const entry = currentBreakdown[idx];
      const kind = entry && entry.muted ? 'noreply' : (entry && entry.label === 'אחר' ? 'other' : 'named');
      const isActive = !!(activeCategoryFilter && entry && activeCategoryFilter.kind === kind && activeCategoryFilter.label === entry.label);
      row.classList.toggle('active', isActive);
    });
  }

  /**
   * סינון לפי עמודה (כמו Excel): לחיצה על סמל המשפך בכותרת עמודה פותחת
   * רשימת הערכים השונים שקיימים בה (עם ספירה), עם תיבות סימון + "בחר
   * הכל/נקה" + החלה. הבחירה נשמרת ב-columnFilters ומוחלת יחד עם החיפוש
   * וסינון הקטגוריה ב-applyFilters_.
   */
  function setupColumnFilterClicks_(columns) {
    document.querySelectorAll('#tableHead .col-filter-icon').forEach(function (icon) {
      icon.addEventListener('click', function (e) {
        e.stopPropagation();
        openColumnFilterPopover_(icon, icon.getAttribute('data-key'));
      });
    });
  }

  function openColumnFilterPopover_(anchorEl, key) {
    closeColumnFilterPopover_();
    const col = COLUMN_DEFS.filter(function (c) { return c.key === key; })[0];
    if (!col || !currentData) return;

    const counts = {};
    currentData.rows.forEach(function (r) {
      const raw = String(col.filterValue(r) || '');
      const label = raw ? raw : '(ריק)';
      counts[label] = (counts[label] || 0) + 1;
    });
    const labels = Object.keys(counts).sort();
    const selected = columnFilters[key]; // Set או undefined (undefined = הכל נבחר, אין סינון)

    const pop = document.createElement('div');
    pop.className = 'filter-pop';
    pop.id = 'columnFilterPopover';
    pop.innerHTML =
      '<div class="fp-title">סינון: ' + escapeHtml_(col.label) + '</div>' +
      '<div class="fp-actions"><span data-act="all">בחר הכל</span><span data-act="none">נקה</span></div>' +
      '<div class="fp-list">' +
        labels.map(function (label) {
          const rawValue = label === '(ריק)' ? '' : label;
          const checked = !selected || selected.has(rawValue);
          return '<label><input type="checkbox" value="' + escapeHtml_(label) + '"' + (checked ? ' checked' : '') + '> ' +
            escapeHtml_(label) + ' (' + counts[label] + ')</label>';
        }).join('') +
      '</div>' +
      '<button type="button" class="fp-apply">החל סינון</button>';

    document.body.appendChild(pop);
    const rect = anchorEl.getBoundingClientRect();
    pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';
    pop.style.left = Math.max(8, window.scrollX + rect.left - 190) + 'px';

    pop.querySelector('[data-act="all"]').addEventListener('click', function () {
      pop.querySelectorAll('input[type="checkbox"]').forEach(function (cb) { cb.checked = true; });
    });
    pop.querySelector('[data-act="none"]').addEventListener('click', function () {
      pop.querySelectorAll('input[type="checkbox"]').forEach(function (cb) { cb.checked = false; });
    });
    pop.querySelector('.fp-apply').addEventListener('click', function () {
      const checkedBoxes = Array.prototype.slice.call(pop.querySelectorAll('input[type="checkbox"]:checked'));
      if (checkedBoxes.length === labels.length) {
        delete columnFilters[key];
      } else {
        columnFilters[key] = new Set(checkedBoxes.map(function (cb) {
          return cb.value === '(ריק)' ? '' : cb.value;
        }));
      }
      closeColumnFilterPopover_();
      applyFilters_(true);
      renderTableHead_(visibleColumns);
    });

    setTimeout(function () { document.addEventListener('click', closeColumnFilterPopoverOnOutsideClick_); }, 0);
  }

  function closeColumnFilterPopoverOnOutsideClick_(e) {
    const pop = document.getElementById('columnFilterPopover');
    if (pop && !pop.contains(e.target)) closeColumnFilterPopover_();
  }

  function closeColumnFilterPopover_() {
    const pop = document.getElementById('columnFilterPopover');
    if (pop) pop.remove();
    document.removeEventListener('click', closeColumnFilterPopoverOnOutsideClick_);
  }

  function setupExport_() {
    const exportBtn = document.getElementById('exportBtn');
    exportBtn.addEventListener('click', function () {
      if (!currentData || !currentTabName) return;
      // מכבד את הסינון הפעיל על המסך (חיפוש + קטגוריה מהלג'נד + סינוני
      // עמודות בסגנון אקסל) - לא מייצא סתם את כל השורות בקמפיין. אם יש
      // סינון פעיל שמצמצם את מה שבאמת ייצא, מתריעים לפני ההורדה - כדי
      // שלעולם לא יקרה שוב "חשבתי שפניתי לכולם" בגלל סינון ששכחו שהיה פעיל.
      const rows = getFilteredRows_();
      const totalInCampaign = currentData.rows.length;
      if (rows.length < totalInCampaign) {
        const proceed = confirm(
          'יש סינון פעיל - מייצאים ' + rows.length + ' מתוך ' + totalInCampaign + ' אנשי קשר בקמפיין.\n' +
          'ללחוץ "אישור" כדי לייצא רק את המסונן, או "ביטול" ואז לנקות סינון כדי לייצא את כולם.'
        );
        if (!proceed) return;
      }

      // רשימת עמודות מצומצמת שנקבעה מפורשות עם הלקוחה - לא כל השדות
      // הזמינים, רק אלה שהיא באמת רוצה לראות בקובץ שיורד. שתי רמות הדגשה:
      // צהוב = התעדכן היום, ירוק חלש = התעדכן מאז ההורדה הקודמת (ר'
      // updatedToday/recentlyUpdated ב-getCampaignData).
      const headers = ['שם חברה', 'שם איש קשר', 'טלפון נייד', 'סטטוס', 'הערות איש קשר', 'הערות מיטוב', 'תאריך'];

      const exportRows = rows.map(function (r) {
        const finalStatus = r.firstReply || r.status || '';
        return {
          values: [r.company || '', r.name || '', r.phone || '', finalStatus, r.reply || '', r.userNotes || '', r.replyDate || ''],
          updatedToday: !!r.updatedToday,
          recentlyUpdated: !!r.recentlyUpdated
        };
      });

      exportBtn.disabled = true;
      const originalLabel = exportBtn.textContent;
      exportBtn.textContent = 'מייצא...';

      google.script.run
        .withSuccessHandler(function (base64) {
          exportBtn.disabled = false;
          exportBtn.textContent = originalLabel;
          // ה-Blob הוא xlsx אמיתי (לא טבלת HTML מחופשת) - תאים אמיתיים,
          // אין תאים ממוזגים, ואפשר לסנן/למיין באקסל בלי בעיה.
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = (currentTabName || 'קמפיין') + '.xlsx';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          // שומרים את רגע ההורדה הזה, כדי שבפעם הבאה נדע לסמן מה השתנה מאז.
          google.script.run.recordExportTime(currentTabName);
        })
        .withFailureHandler(function (err) {
          exportBtn.disabled = false;
          exportBtn.textContent = originalLabel;
          alert('שגיאה בייצוא לאקסל: ' + (err.message || err));
        })
        .exportCampaignExcel(currentTabName, headers, exportRows);
    });
  }

  function setupAddContact_() {
    const modal = document.getElementById('addModal');
    const companyInput = document.getElementById('addCompany');
    const nameInput = document.getElementById('addName');
    const titleInput = document.getElementById('addTitle');
    const phoneInput = document.getElementById('addPhone');
    const emailInput = document.getElementById('addEmail');
    const sourceInput = document.getElementById('addSource');
    const errorEl = document.getElementById('addError');
    const saveBtn = document.getElementById('addSaveBtn');
    const allInputs = [companyInput, nameInput, titleInput, phoneInput, emailInput, sourceInput];

    function openModal() {
      document.getElementById('addModalTab').textContent = currentTabName || '';
      allInputs.forEach(function (input) { input.value = ''; });
      errorEl.textContent = '';
      modal.classList.add('show');
      companyInput.focus();
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function save() {
      const phone = phoneInput.value.trim();
      if (!phone) {
        errorEl.textContent = 'חובה להזין מספר טלפון';
        return;
      }
      if (!currentTabName) {
        errorEl.textContent = 'לא נבחר קמפיין';
        return;
      }
      const fields = {
        company: companyInput.value.trim(),
        name: nameInput.value.trim(),
        title: titleInput.value.trim(),
        phone: phone,
        email: emailInput.value.trim(),
        source: sourceInput.value.trim()
      };
      saveBtn.disabled = true;
      errorEl.textContent = '';
      google.script.run
        .withSuccessHandler(function () {
          saveBtn.disabled = false;
          closeModal();
          loadCampaign(currentTabName);
        })
        .withFailureHandler(function (err) {
          saveBtn.disabled = false;
          errorEl.textContent = 'שגיאה: ' + (err.message || err);
        })
        .addContact(currentTabName, fields);
    }

    document.getElementById('addContactBtn').addEventListener('click', openModal);
    document.getElementById('addCancelBtn').addEventListener('click', closeModal);
    saveBtn.addEventListener('click', save);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    phoneInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  }

  /**
   * חלון "עדכון פנימי" (CRM) - נפתח בלחיצה על ה-"+"/תגית ההערות בשורה.
   * מאפשר לעדכן "סטטוס משתמש" (ערך נוכחי אחד, נדרס) ולהוסיף "הערה
   * חדשה" ליומן ההערות (מצטבר, החדשה תמיד למעלה). אחרי שמירה מביאים
   * מחדש את נתוני הקמפיין (getCampaignData) כדי גם לרענן את הטבלה
   * הראשית ברקע וגם להציג בחלון עצמו את ההיסטוריה המעודכנת.
   */
  function setupCrmModal_() {
    const modal = document.getElementById('crmModal');
    const contactLabel = document.getElementById('crmModalContact');
    const currentStatusEl = document.getElementById('crmCurrentStatus');
    const userSel = document.getElementById('crmUser');
    const statusText = document.getElementById('crmStatusText');
    const noteText = document.getElementById('crmNoteText');
    const errorEl = document.getElementById('crmError');
    const historyEl = document.getElementById('crmNoteHistory');
    const saveBtn = document.getElementById('crmSaveBtn');
    const aiSummaryEl = document.getElementById('crmAiSummary');
    const aiErrorEl = document.getElementById('crmAiError');
    const aiBtn = document.getElementById('crmAiBtn');
    const salesTipEl = document.getElementById('crmSalesTip');
    const salesTipBtn = document.getElementById('crmSalesTipBtn');
    let modalPhone = null;

    function populateUsers_(sel) {
      const users = (currentData && currentData.teamUsers) || ['מזי', 'טליה'];
      sel.innerHTML = users.map(function (u) { return '<option value="' + escapeHtml_(u) + '">' + escapeHtml_(u) + '</option>'; }).join('');
    }

    // תיבת היסטוריה היא textarea לקריאה בלבד (readonly) - טוענים אליה את
    // כל מחרוזת ההערות הגולמית כמו שהיא (כל הערה כבר שורה נפרדת, החדשה
    // ביותר למעלה - ר' appendNoteEntry_ ב-Code.gs). אם ריקה, ה-placeholder
    // של התיבה עצמה ("אין הערות עדיין") מוצג אוטומטית.
    function renderHistory_(notes) {
      historyEl.value = notes ? String(notes) : '';
    }

    function findRow_(phone) {
      if (!currentData) return null;
      return currentData.rows.filter(function (r) { return String(r.phone) === String(phone); })[0] || null;
    }

    function openModal(phone, autoSummarize) {
      modalPhone = phone;
      const row = findRow_(phone);
      contactLabel.textContent = row ? [row.name, row.company, row.phone].filter(Boolean).join(' · ') : phone;
      currentStatusEl.textContent = (row && row.firstReply) || 'ללא סטטוס';
      populateUsers_(userSel);
      statusText.value = '';
      noteText.value = '';
      errorEl.textContent = '';
      aiSummaryEl.textContent = 'לא נוצר סיכום עדיין';
      aiErrorEl.textContent = '';
      salesTipEl.textContent = '';
      salesTipEl.style.display = 'none';
      salesTipBtn.style.display = 'none';
      renderHistory_(row && row.userNotes);
      modal.classList.add('show');
      if (autoSummarize) generateSummary_();
    }

    function closeModal() {
      modal.classList.remove('show');
      modalPhone = null;
      errorEl.textContent = '';
      aiErrorEl.textContent = '';
    }

    // מסכם עם Gemini את היסטוריית השיחה האמיתית (וואטסאפ + שיחות) של איש
    // הקשר - לא את ההערות הפנימיות של הצוות. Gemini מחזיר גם טיפ מכירה
    // ממוקד (salesTip) - מוצג רק בלחיצה על כפתור השרביט 🪄, מוסתר כברירת
    // מחדל כדי לא לעמוס את הסיכום עצמו.
    function generateSummary_() {
      if (!modalPhone || !currentTabName) return;
      aiBtn.disabled = true;
      aiErrorEl.textContent = '';
      aiSummaryEl.textContent = 'מייצר סיכום...';
      salesTipEl.textContent = '';
      salesTipEl.style.display = 'none';
      salesTipBtn.style.display = 'none';
      google.script.run
        .withSuccessHandler(function (result) {
          aiBtn.disabled = false;
          aiSummaryEl.textContent = (result && result.summary) || 'אין מספיק מידע לסיכום';
          if (result && result.salesTip) {
            salesTipBtn.style.display = '';
            salesTipBtn.setAttribute('data-tip', result.salesTip);
          }
        })
        .withFailureHandler(function (err) {
          aiBtn.disabled = false;
          aiSummaryEl.textContent = 'לא נוצר סיכום עדיין';
          aiErrorEl.textContent = 'שגיאה: ' + (err.message || err);
        })
        .summarizeContact(currentTabName, modalPhone);
    }

    // אחרי שמירה, מביאים מחדש את כל נתוני הקמפיין - גם כדי לרענן את
    // הטבלה הראשית (כולל תגית ההערות/סטטוס בשורה) וגם כדי להציג בחלון
    // עצמו את ההיסטוריה המעודכנת, בלי לנחש את השינוי בצד הלקוח.
    function refreshAfterSave_() {
      google.script.run.withSuccessHandler(function (data) {
        renderCampaign(data, true);
        const row = (data && data.rows || []).filter(function (r) { return String(r.phone) === String(modalPhone); })[0];
        currentStatusEl.textContent = (row && row.firstReply) || 'ללא סטטוס';
        renderHistory_(row && row.userNotes);
      }).getCampaignData(currentTabName);
    }

    // כפתור "שמור וסגור" אחד ששומר גם סטטוס וגם הערה (מה שמולא בפועל),
    // בלי צורך בשתי פעולות שמירה נפרדות - ואז סוגר את החלון עם קונפטי.
    function saveAll_() {
      const statusVal = statusText.value.trim();
      const noteVal = noteText.value.trim();
      if (!statusVal && !noteVal) { errorEl.textContent = 'יש להזין סטטוס ו/או הערה'; return; }
      if (!modalPhone || !currentTabName) return;
      saveBtn.disabled = true;
      errorEl.textContent = '';

      function onError(err) {
        saveBtn.disabled = false;
        errorEl.textContent = 'שגיאה: ' + (err.message || err);
      }
      function afterAll() {
        saveBtn.disabled = false;
        refreshAfterSave_();
        closeModal();
        // קונפטי רק כשהסטטוס שנשמר הוא קביעת פגישה - כל שמירה אחרת
        // (או שמירה שלא כללה שינוי סטטוס בכלל) מציגה רק ✓ קטן שמתפוגג.
        if (MEETING_STATUSES.indexOf(statusVal) !== -1) fireConfetti_();
        else showSavedToast_();
      }
      function doNoteIfNeeded() {
        if (noteVal) {
          google.script.run.withSuccessHandler(afterAll).withFailureHandler(onError)
            .addUserNote(currentTabName, modalPhone, userSel.value, noteVal);
        } else {
          afterAll();
        }
      }
      if (statusVal) {
        google.script.run.withSuccessHandler(doNoteIfNeeded).withFailureHandler(onError)
          .setUserStatus(currentTabName, modalPhone, userSel.value, statusVal);
      } else {
        doNoteIfNeeded();
      }
    }

    document.getElementById('tableBody').addEventListener('click', function (e) {
      const aiTrigger = e.target.closest('.ai-summary-btn');
      if (aiTrigger) {
        const phone = aiTrigger.getAttribute('data-phone');
        if (phone) openModal(phone, true);
        return;
      }
      const trigger = e.target.closest('.add-note-btn, .note-chip');
      if (!trigger) return;
      const phone = trigger.getAttribute('data-phone');
      if (phone) openModal(phone, false);
    });
    document.getElementById('crmCloseBtn').addEventListener('click', closeModal);
    saveBtn.addEventListener('click', saveAll_);
    aiBtn.addEventListener('click', function () { generateSummary_(); });
    salesTipBtn.addEventListener('click', function () {
      const isHidden = salesTipEl.style.display === 'none';
      if (isHidden) {
        salesTipEl.textContent = '🪄 ' + salesTipBtn.getAttribute('data-tip');
        salesTipEl.style.display = '';
      } else {
        salesTipEl.style.display = 'none';
      }
    });
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  }

  function setupShare_() {
    document.getElementById('shareBtn').addEventListener('click', function () {
      const url = currentTabName ? BASE_URL + '?tab=' + encodeURIComponent(currentTabName) : BASE_URL;
      const toast = document.getElementById('copyToast');
      const showToast = function () {
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showToast).catch(function () { legacyCopy_(url); showToast(); });
      } else {
        legacyCopy_(url);
        showToast();
      }
    });
  }

  function legacyCopy_(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  function showError(err) {
    document.getElementById('tabs').innerHTML = '<span class="empty-state">שגיאה בטעינת הנתונים: ' + escapeHtml_(err.message || err) + '</span>';
  }

  // צבע קבוע לסטטוסים מוכרים, כדי שהצבע יהיה עקבי בין הטבלה לגרף ובין
  // רענונים - וצבע דטרמיניסטי (hash) לכל סטטוס אחר/חדש שלא ברשימה, כדי
  // שגם הוא תמיד יקבל את אותו הצבע (לא אקראי בכל טעינה).
  const KNOWN_STATUS_COLORS = {
    'נשלח וואטסאפ': '#1FAA59',
    'נשמח להיפגש': '#2E82FF',
    'תואמה פגישה מקוונת': '#7C5CFC',
    'תואמה פגישה פרונטלית': '#0EA5A5',
    'בתהליך': '#0891B2',
    'פחות רלוונטי כרגע': '#E1442F',
    'ממתין לתשובה': '#B7791F',
    'לא ענה': '#6B7280'
  };
  const STATUS_COLOR_FALLBACK_PALETTE = ['#DB2777', '#65A30D', '#9333EA', '#0D9488', '#EA580C', '#4338CA'];
  let customStatusColors = {}; // מטאב "צבעי סטטוס" (אופציונלי) - ר' renderCampaign/getStatusColors_

  // מנרמלת בדיוק כמו normalizeLabel_ בצד השרת (Code.gs) - מורידה גרשיים/
  // רווח כפול/רווח בקצה/רישיות - כדי שהתאמה לטאב "צבעי סטטוס" לא תישבר
  // בשקט בגלל הבדל עיצוב קטן בין הטקסטים.
  function normalizeStatusKey_(s) {
    return String(s || '').replace(/["'״׳]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  // סדר עדיפות: צבע שהלקוחה הגדירה בעצמה בטאב "צבעי סטטוס" > צבע קבוע
  // מוכר בקוד > צבע דטרמיניסטי (hash) לכל סטטוס אחר/חדש.
  function colorForStatus_(status) {
    const s = String(status || '');
    const customColor = customStatusColors[normalizeStatusKey_(s)];
    if (customColor) return customColor;
    if (KNOWN_STATUS_COLORS[s]) return KNOWN_STATUS_COLORS[s];
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return STATUS_COLOR_FALLBACK_PALETTE[hash % STATUS_COLOR_FALLBACK_PALETTE.length];
  }

  function softStatusColor_(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',0.14)';
  }

  /**
   * מצמידה צבע לכל קטגוריית תגובה - אותו צבע בדיוק שמוצג גם על תגית
   * הסטטוס בטבלה (colorForStatus_), כדי שלא יהיה בלבול בין הגרף לטבלה.
   * "טרם ענו" (מסומנת muted מהשרת) מקבלת תמיד צבע אפרפר ניטרלי, כדי
   * שתובלט כקבוצה שונה מהותית (מי שעדיין לא הגיב) ולא כעוד תשובה בין השאר.
   */
  function colorizeBreakdown_(entries) {
    const styles = getComputedStyle(document.documentElement);
    const mutedColor = styles.getPropertyValue('--cat-muted').trim();
    return entries.map(function (e) {
      return { label: e.label, count: e.count, muted: !!e.muted, color: e.muted ? mutedColor : colorForStatus_(e.label) };
    });
  }

  /**
   * גרף הפילוח - עכשיו בגודל קומפקטי (תא רחב בשורת הסטטיסטיקה, לא כרטיס
   * נפרד) - טבעת דקה עם האחוז שהגיב במרכז, בלי טקסט "הגיבו" נוסף שלא
   * נכנס בגודל הזה.
   */
  function drawBreakdown_(entries) {
    const canvas = document.getElementById('donut');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 70;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const styles = getComputedStyle(document.documentElement);
    const bg = styles.getPropertyValue('--surface').trim();
    const text = styles.getPropertyValue('--text').trim();

    const total = entries.reduce(function (s, e) { return s + e.count; }, 0) || 1;
    const repliedTotal = entries.reduce(function (s, e) { return s + (e.muted ? 0 : e.count); }, 0);

    const cx = size / 2, cy = size / 2, rOuter = 32, rInner = 20;
    let start = -Math.PI / 2;

    ctx.clearRect(0, 0, size, size);

    entries.forEach(function (seg) {
      if (!seg.count) return;
      const angle = (seg.count / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, rOuter, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      // רווח דק בין פלחים כדי שיהיו קריאים כנפרדים.
      ctx.strokeStyle = bg;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      start += angle;
    });

    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = text;
    ctx.font = '800 13px "Segoe UI", Arial, sans-serif';
    ctx.fillText(Math.round((repliedTotal / total) * 100) + '%', cx, cy);
  }

  loadTabs();
  setupSearch_();
  setupExport_();
  setupAddContact_();
  setupCrmModal_();
  setupShare_();

  // רענון אוטומטי: כל 30 שניות טוענים מחדש את נתוני הטאב הפעיל (בלי לגעת
  // ברשימת הטאבים עצמה, כדי לא "לקפוץ" למשתמש בזמן שהוא מסתכל).
  setInterval(function () {
    if (currentTabName) loadCampaign(currentTabName, true);
  }, AUTO_REFRESH_MS);
</script>
