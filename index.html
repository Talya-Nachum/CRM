  :root {
    --blush: #fdf2f2;
    --blush2: #f4ecec;
    --cream: #FAF3EC;
    --rosegold: #C9A27A;
    --rose: #E8A9B0;
    --rose-deep: #C06B7A;
    --lavender: #C9BFE0;
    --amber: #E8C27A;
    --ink: #3A3538;
    --ink-soft: #877E82;
    --ink-faint: #B3A9AC;
    --glass-bg: rgba(255,255,255,0.4);
    --glass-bg-strong: rgba(255,255,255,0.58);
    --glass-border: rgba(255,255,255,0.6);
    --shadow-xl: 0 25px 50px -12px rgba(136,19,55,0.10), 0 2px 6px rgba(136,19,55,0.04);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body {
    direction: rtl;
    font-family: 'Rubik', -apple-system, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(45% 38% at 88% -4%, rgba(232,169,176,0.55) 0%, transparent 68%),
      radial-gradient(50% 42% at 6% 12%, rgba(201,191,224,0.5) 0%, transparent 68%),
      radial-gradient(55% 46% at 50% 105%, rgba(232,194,122,0.4) 0%, transparent 68%),
      linear-gradient(160deg, var(--blush) 0%, var(--blush2) 55%, var(--cream) 100%);
  }
  .num { font-variant-numeric: tabular-nums; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    max-width: 1200px; margin: 0 auto; padding: 22px 24px 6px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rosegold); box-shadow: 0 0 10px rgba(201,162,122,0.7); }
  .brand small { font-weight: 500; color: var(--ink-soft); font-size: 12px; }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .search {
    display: flex; align-items: center; gap: 7px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow-xl);
    font-size: 12.5px; color: var(--ink-faint);
  }
  .profile {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--rose), var(--rosegold));
    border: 1px solid var(--glass-border); box-shadow: var(--shadow-xl);
  }

  .stage { max-width: 1200px; margin: 0 auto; padding: 14px 24px 60px; }

  .board { display: grid; grid-template-columns: 0.85fr 1.4fr 0.85fr; gap: 24px; align-items: start; }
  @media (max-width: 920px) { .board { grid-template-columns: 1fr; } }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-xl);
    border-radius: 24px;
  }
  .glass-strong {
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-xl);
    border-radius: 20px;
  }

  .col { display: flex; flex-direction: column; gap: 24px; }
  .panel { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .panel-title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-soft); }

  /* AI agent column */
  .ai-glow { display: flex; justify-content: center; position: relative; }
  .ai-glow::before {
    content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,122,0.5), transparent 70%);
    filter: blur(8px);
  }
  .ai-ring {
    position: relative; width: 100px; height: 100px; border-radius: 50%;
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ai-ring svg { width: 88px; height: 88px; }
  .ai-name { text-align: center; font-size: 15px; font-weight: 700; }

  .bubble { padding: 16px 18px; font-size: 13.5px; line-height: 1.65; border-radius: 18px 18px 4px 18px; }

  .composer {
    display: flex; align-items: center; gap: 8px;
    border-radius: 999px; padding: 7px;
  }
  .composer input { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--ink); min-width: 0; }
  .composer input::placeholder { color: var(--ink-faint); }
  .composer button {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--rose), var(--rosegold)); color: #fff; font-size: 13px; cursor: pointer;
  }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 560px) { .kanban { grid-template-columns: 1fr; } }
  .kstage { display: flex; flex-direction: column; gap: 10px; }
  .kcards { display: flex; flex-direction: column; gap: 10px; }
  .kstage-title { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .kstage-title .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--rose-deep); }
  .kstage.doing .sw { background: var(--lavender); }
  .kstage.done .sw { background: var(--amber); }
  .kcard { padding: 14px; display: flex; flex-direction: column; gap: 9px; }
  .kcard .k-title { font-size: 12.5px; font-weight: 600; line-height: 1.4; }
  .ktag { display: inline-flex; align-self: flex-start; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .ktag.rose { background: rgba(232,169,176,0.35); color: var(--rose-deep); }
  .ktag.purple { background: rgba(201,191,224,0.4); color: #6B5A96; }
  .ktag.amber { background: rgba(232,194,122,0.4); color: #8C6A1E; }

  /* Agenda column */
  .rem-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; line-height: 1.55; }
  .rem-row .r-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rose-deep); margin-top: 5px; flex: none; }

  .tblock { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px; }
  .tblock .t-time { font-size: 11px; font-weight: 700; color: var(--ink-soft); min-width: 36px; }
  .tblock .t-bar { width: 5px; height: 24px; border-radius: 3px; flex: none; }
  .tblock .t-bar.g1 { background: linear-gradient(180deg, var(--rose), var(--rosegold)); }
  .tblock .t-bar.g2 { background: linear-gradient(180deg, var(--lavender), var(--rose)); }
  .tblock .t-bar.g3 { background: linear-gradient(180deg, var(--amber), var(--rosegold)); }
  .tblock .t-title { font-size: 12px; }

  .rec-box {
    padding: 14px; border-radius: 16px; position: relative;
    border: 1px solid rgba(201,162,122,0.55);
    box-shadow: 0 0 0 1px rgba(201,162,122,0.15), 0 0 24px rgba(201,162,122,0.25);
  }
  .rec-box .rec-title { font-size: 11.5px; font-weight: 700; color: var(--rosegold); margin-bottom: 8px; }
  .rec-line { font-size: 12px; line-height: 1.6; margin-bottom: 6px; }
  .rec-line:last-child { margin-bottom: 0; }

  footer { max-width: 1200px; margin: 0 auto; font-size: 12px; color: var(--ink-faint); text-align: center; line-height: 1.7; padding: 10px 22px 0; }
  footer b { color: var(--ink-soft); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>הדסה <small>| עוזרת אינטליגנטית</small></div>
  <div class="topbar-right">
    <div class="search">🔍<span>חיפוש…</span></div>
    <div class="profile"></div>
  </div>
</div>

<div class="stage">
  <div class="board">
    <div class="col">
      <div class="glass panel">
        <div class="ai-glow">
          <div class="ai-ring">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="scarf10" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#EFE0C4"/>
                  <stop offset="45%" stop-color="#C79A4B"/>
                  <stop offset="100%" stop-color="#3E8E8A"/>
                </linearGradient>
              </defs>
              <circle cx="100" cy="150" r="80" fill="#7A3448"/>
              <ellipse cx="100" cy="92" rx="34" ry="36" fill="#F3D3BC"/>
              <path d="M66 78 Q62 48 100 42 Q138 48 134 78 Q142 96 134 118 Q138 80 100 74 Q62 80 66 118 Q58 96 66 78 Z" fill="url(#scarf10)"/>
              <rect x="64" y="72" width="72" height="8" rx="4" fill="#C98FA0" opacity="0.85"/>
              <ellipse cx="89" cy="94" rx="4.6" ry="3.4" fill="#7A5FA0"/>
              <ellipse cx="111" cy="94" rx="4.6" ry="3.4" fill="#7A5FA0"/>
              <path d="M92 106 Q100 111 108 106" stroke="#B25C6C" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="ai-name">הדסה</div>

        <div class="glass-strong bubble" id="bubbleText">היי טליה! טוענת את הלוח שלך…</div>

        <div class="glass-strong composer">
          <input type="text" placeholder="הוספת משימות היא דרך שיחה איתי בצ'אט הרגיל" disabled />
          <button aria-label="שליחה" disabled>➤</button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="glass panel">
        <div class="panel-title">זרימת עבודה</div>
        <div class="kanban">
          <div class="kstage">
            <div class="kstage-title"><span class="sw"></span>לביצוע</div>
            <div class="kcards" id="kanbanTodo"></div>
          </div>
          <div class="kstage doing">
            <div class="kstage-title"><span class="sw"></span>בתהליך</div>
            <div class="kcards" id="kanbanDoing"></div>
          </div>
          <div class="kstage done">
            <div class="kstage-title"><span class="sw"></span>בוצע</div>
            <div class="kcards" id="kanbanDone"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="glass panel">
        <div class="panel-title">תזכורות חכמות</div>
        <div id="remindersList"></div>
      </div>

      <div class="glass panel">
        <div class="panel-title">לוח היום</div>
        <div id="timelineList"></div>
      </div>

      <div class="glass-strong rec-box">
        <div class="rec-title">המלצות הדסה</div>
        <div class="rec-line">להזיז את "בדיקת התוכן" ל-13:00 לריכוז טוב יותר</div>
        <div class="rec-line">להתקשר לאלי לפני 11:00 — הקשר בעדיפות גבוהה</div>
      </div>
    </div>
  </div>

  <footer id="updatedFooter">טוען נתונים…</footer>
</div>

<script>
  const tagLabel = { rose: 'עדיפות גבוהה', amber: 'חשבון', purple: 'בעבודה' };
  const barClass = ['g1', 'g2', 'g3'];

  function renderKanban(col, items) {
    const el = document.getElementById(col);
    el.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'glass-strong kcard';
      card.innerHTML = `<span class="ktag ${item.tag}">${tagLabel[item.tag] || ''}</span><div class="k-title"></div>`;
      card.querySelector('.k-title').textContent = item.title;
      el.appendChild(card);
    });
  }

  function renderReminders(items) {
    const el = document.getElementById('remindersList');
    el.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'rem-row';
      row.innerHTML = `<span class="r-dot"></span><span></span>`;
      row.querySelector('span:last-child').textContent = item.title;
      if (item.urgent) row.querySelector('.r-dot').style.background = 'var(--rose-deep)';
      el.appendChild(row);
    });
  }

  function renderTimeline(items) {
    const el = document.getElementById('timelineList');
    el.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'glass-strong tblock';
      row.innerHTML = `<span class="t-time num"></span><span class="t-bar ${barClass[i % 3]}"></span><span class="t-title"></span>`;
      row.querySelector('.t-time').textContent = item.time;
      row.querySelector('.t-title').textContent = item.title;
      el.appendChild(row);
    });
  }

  fetch('tasks.json?t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      renderKanban('kanbanTodo', data.kanban.todo);
      renderKanban('kanbanDoing', data.kanban.doing);
      renderKanban('kanbanDone', data.kanban.done);
      renderReminders(data.reminders);
      renderTimeline(data.timeline);
      const openCount = data.kanban.todo.length + data.kanban.doing.length;
      document.getElementById('bubbleText').textContent =
        openCount > 0
          ? `היי טליה! נשארו ${openCount} דברים פתוחים היום — קחי את זה בקצב שלך.`
          : `היי טליה! הכל מסודר להיום. איזה כיף.`;
      const updated = new Date(data.updated);
      document.getElementById('updatedFooter').textContent =
        'עודכן לאחרונה: ' + updated.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
    })
    .catch(() => {
      document.getElementById('bubbleText').textContent = 'לא הצלחתי לטעון את הנתונים כרגע.';
      document.getElementById('updatedFooter').textContent = '';
    });
</script>
</body>
</html>
