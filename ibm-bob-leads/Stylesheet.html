<style>
  :root {
    --ink: #10151f;
    --navy-900: #0b1526;
    --navy-800: #131f36;
    --navy-700: #1c2c4a;
    --paper: #f1f3f8;
    --surface: #ffffff;
    --border: #dfe3ec;
    --muted: #6b7284;
    --gold-600: #c99a3d;
    --gold-700: #a97f26;
    --gold-100: #f7edd9;
    --st-new: #64748b;
    --st-progress: #b8791f;
    --st-self: #0f7a6b;
    --st-mituv: #2f4a7a;
    --st-erez: #7a4fb0;
    --st-out: #b6423a;
    /* צבעי הסקטורים - שוק ההון/אנרגיה/בריאות. TODO(client): להתאים אם יש
       גם צבעוניות רשמית מ-Blue Solutions/IBM לכל מסלול. */
    --sec-capital: #2f5fa8;
    --sec-energy: #d9822b;
    --sec-health: #159a8a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif;
  }

  header.hub {
    background: linear-gradient(180deg, var(--navy-900), var(--navy-800));
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .logo-mark { display: flex; align-items: center; gap: 10px; }
  .logo-mark svg { width: 34px; height: 34px; flex-shrink: 0; }
  .logo-mark svg.mituv-icon { width: 30px; height: 30px; }
  .logo-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.25); flex-shrink: 0; }
  .client-logo-placeholder {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px;
    border: 1px dashed rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #b7c0d6;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .logo-text .word { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
  .logo-text .tag { font-size: 11px; color: #b7c0d6; font-weight: 500; }

  .modal.modal-wide { max-width: 780px; }
  #sectorOverlay .modal { max-width: 640px; }

  svg.bob-icon { width: 30px; height: 30px; flex-shrink: 0; }

  /* --- 3 באנרי הסקטור ב-header --- */
  .sector-banners { display: flex; gap: 10px; margin-inline-start: auto; flex-wrap: wrap; }
  .sector-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 8px 18px; border-radius: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05);
    min-width: 100px;
  }
  .sector-btn:hover { background: rgba(255,255,255,0.1); }
  .sector-btn .sec-n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
  .sector-btn .sec-u { font-size: 11px; color: #cfd6e6; font-weight: 600; }
  .sector-btn.capital { border-color: var(--sec-capital); }
  .sector-btn.capital .sec-n { color: #8fb4e8; }
  .sector-btn.energy { border-color: var(--sec-energy); }
  .sector-btn.energy .sec-n { color: #f3b96b; }
  .sector-btn.health { border-color: var(--sec-health); }
  .sector-btn.health .sec-n { color: #6fd9c8; }

  /* --- תגית סקטור בטבלה הראשית --- */
  .sector-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .sector-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .sector-tag.capital .sector-dot { background: var(--sec-capital); }
  .sector-tag.energy .sector-dot { background: var(--sec-energy); }
  .sector-tag.health .sector-dot { background: var(--sec-health); }

  /* --- מודאל הסקטור (נפתח בלחיצה על באנר) --- */
  .sector-modal-head {
    padding: 20px 24px; color: #fff; border-radius: 14px 14px 0 0;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .sector-modal-head.capital { background: linear-gradient(135deg, var(--sec-capital), #1c3f78); }
  .sector-modal-head.energy { background: linear-gradient(135deg, var(--sec-energy), #a8590f); }
  .sector-modal-head.health { background: linear-gradient(135deg, var(--sec-health), #0d6d61); }
  .sector-modal-head h2 { margin: 0 0 4px; font-size: 18px; }
  .sector-modal-head .sub { font-size: 12.5px; opacity: 0.85; }
  .sector-modal-head .icon-x { color: #fff; }

  .sector-countdown { display: flex; gap: 14px; margin-top: 12px; }
  .sector-countdown .u { text-align: center; }
  .sector-countdown .u .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
  .sector-countdown .u .l { font-size: 10px; opacity: 0.8; }

  .sector-modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .sector-actions { display: flex; gap: 10px; }
  .btn-info { background: var(--gold-100); color: var(--gold-700); border: 1px solid var(--gold-600); }

  .mini-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 260px; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .mini-table th { position: static; padding: 8px; }
  .mini-table td { padding: 10px 8px; font-size: 12.5px; }

  main { padding: 22px 28px 60px; max-width: 1320px; margin: 0 auto; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

  .search-input, .status-filter, select, input, textarea {
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }

  .search-input { min-width: 240px; flex: 1; }

  .btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary { background: var(--navy-800); color: #fff; }
  .btn-primary:hover { background: var(--navy-700); }
  .btn-wa { background: #1f8f5c; color: #fff; }
  .btn-wa:disabled { background: #9fb8ac; cursor: not-allowed; opacity: 0.6; }
  .btn-plain { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: #fbe3e1; color: #a3312a; }

  .count-pill { margin-inline-start: auto; font-size: 12.5px; color: var(--muted); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    /* גובה חסום כדי שהטבלה עצמה תגלול פנימית (לא כל הדף) - זה מה שמאפשר
       ל-position:sticky על ה-th להיצמד באמינות לראש הטבלה: sticky נצמד
       תמיד לגבול הגלילה הכי קרוב, וכשה-wrap עצמו לא באמת גולל (גובה auto
       ללא הגבלה) אין לו גבול גלילה אמיתי וההדבקה לא עובדת בפועל. */
    max-height: calc(100vh - var(--header-h, 74px) - 130px);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1100px; }

  th {
    text-align: right;
    padding: 11px 10px;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
    font-size: 12px;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  td { padding: 24px 14px; border-bottom: 1px solid #eceef3; vertical-align: middle; line-height: 1.6; }

  .reply-cell { display: flex; flex-direction: column; gap: 3px; max-width: 220px; }
  .reply-cell .reply-text { white-space: normal; }
  .reply-cell .reply-date { font-size: 11px; color: var(--muted); }
  tbody tr:hover { background: var(--paper); cursor: pointer; }
  tbody tr.selected { background: var(--gold-100); }

  .empty-row { text-align: center; color: var(--muted); padding: 30px !important; cursor: default; }

  .badge {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }

  .row-edit { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--muted); }
  .icon-x { background: none; border: none; font-size: 17px; cursor: pointer; color: var(--muted); }

  .overlay {
    position: fixed; inset: 0; background: rgba(15,20,32,0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }

  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 13px; }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); }

  .template-choice { display: flex; flex-direction: column; gap: 8px; }
  .tpl-option {
    border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px;
  }
  .tpl-option.checked { border-color: var(--gold-600); background: var(--gold-100); }

  .recipients-list { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
  .recipients-list span {
    background: var(--paper); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }

  .admin-msg { font-size: 12.5px; color: #a3312a; }

  footer.modal-actions { display: flex; gap: 10px; padding: 6px 20px 18px; justify-content: flex-end; }
  .spacer { flex: 1; }
  .hidden { display: none !important; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--navy-900); color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 100;
  }
  .toast.error { background: #a3312a; }
</style>
