<script>
  var allLeads = [];
  var allStatuses = [];
  var allTemplates = [];
  var allSectors = [];
  var selectedIds = new Set();
  var sectorSelectedIds = new Set();
  var currentSectorKey = null;
  var sectorCountdownTimer = null;
  var statusColorMap = {};
  var palette = ['#64748b', '#b8791f', '#0f7a6b', '#2f4a7a', '#7a4fb0', '#b6423a', '#0891b2', '#be185d'];

  document.addEventListener('DOMContentLoaded', function () {
    syncHeaderHeight();
    window.addEventListener('resize', syncHeaderHeight);

    loadConfig();
    loadStatuses();
    loadTemplates();
    loadLeads();

    document.getElementById('addLeadBtn').addEventListener('click', openAddModal);
    document.getElementById('exportExcelBtn').addEventListener('click', onExportExcel);
    document.getElementById('closeLeadModalBtn').addEventListener('click', closeLeadModal);
    document.getElementById('cancelLeadBtn').addEventListener('click', closeLeadModal);
    document.getElementById('leadForm').addEventListener('submit', onSubmitLead);
    document.getElementById('deleteLeadBtn').addEventListener('click', onDeleteLead);
    document.getElementById('searchInput').addEventListener('input', renderTable);
    document.getElementById('statusFilter').addEventListener('change', renderTable);
    document.getElementById('sectorFilter').addEventListener('change', renderTable);
    document.getElementById('selectAll').addEventListener('change', onSelectAll);

    document.getElementById('waBtn').addEventListener('click', openWaModal);
    document.getElementById('closeWaModalBtn').addEventListener('click', closeWaModal);
    document.getElementById('cancelWaBtn').addEventListener('click', closeWaModal);
    document.getElementById('sendWaBtn').addEventListener('click', onSendWhatsApp);

    document.getElementById('closeSectorModalBtn').addEventListener('click', closeSectorModal);
    document.getElementById('sectorSelectAll').addEventListener('change', onSectorSelectAll);
    document.getElementById('sectorInfoBtn').addEventListener('click', onSectorInfoClick);
    document.getElementById('sectorWaBtn').addEventListener('click', onSendSectorWhatsApp);
  });

  /* ---------- config (header: logo + 3 sector banners) ---------- */

  function syncHeaderHeight() {
    var header = document.querySelector('header.hub');
    if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }

  function loadConfig() {
    google.script.run.withSuccessHandler(function (cfg) {
      document.getElementById('clientNameLabel').textContent = cfg.clientName;
      allSectors = cfg.sectors || [];
      renderSectorBanners();
      populateSectorSelects();
      syncHeaderHeight();
    }).withFailureHandler(showError).getConfig();
  }

  function sectorByKey(key) {
    return allSectors.filter(function (s) { return s.key === key; })[0] || null;
  }

  function renderSectorBanners() {
    var wrap = document.getElementById('sectorBanners');
    wrap.innerHTML = allSectors.map(function (s) {
      var count = allLeads.filter(function (l) { return l.sector === s.key; }).length;
      return '<button class="sector-btn ' + s.color + '" data-sector="' + s.key + '">' +
        '<span class="sec-n">' + count + '</span><span class="sec-u">' + s.icon + ' ' + escapeHtml(s.label) + '</span>' +
        '</button>';
    }).join('');
    wrap.querySelectorAll('.sector-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { openSectorModal(btn.dataset.sector); });
    });
  }

  function populateSectorSelects() {
    var filter = document.getElementById('sectorFilter');
    filter.innerHTML = '<option value="">כל הסקטורים</option>';
    allSectors.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s.key; opt.textContent = s.icon + ' ' + s.label;
      filter.appendChild(opt);
    });

    var formSelect = document.getElementById('f_sector');
    formSelect.innerHTML = '<option value="">לא משויך</option>';
    allSectors.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s.key; opt.textContent = s.icon + ' ' + s.label;
      formSelect.appendChild(opt);
    });
  }

  /* ---------- data loading ---------- */

  function loadLeads() {
    google.script.run.withSuccessHandler(function (leads) {
      allLeads = leads;
      renderTable();
      renderSectorBanners();
    }).withFailureHandler(showError).getLeads();
  }

  function loadStatuses() {
    google.script.run.withSuccessHandler(function (statuses) {
      allStatuses = statuses;
      assignStatusColors();
      populateStatusSelects();
    }).withFailureHandler(showError).getStatuses();
  }

  function loadTemplates() {
    google.script.run.withSuccessHandler(function (templates) {
      allTemplates = templates;
    }).withFailureHandler(showError).getTemplates();
  }

  function assignStatusColors() {
    allStatuses.forEach(function (s, i) {
      if (!statusColorMap[s]) statusColorMap[s] = palette[i % palette.length];
    });
  }

  function colorForStatus(status) {
    if (!statusColorMap[status]) {
      var idx = Object.keys(statusColorMap).length % palette.length;
      statusColorMap[status] = palette[idx];
    }
    return statusColorMap[status];
  }

  function populateStatusSelects() {
    var filter = document.getElementById('statusFilter');
    var current = filter.value;
    filter.innerHTML = '<option value="">כל הסטטוסים</option>';
    allStatuses.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      filter.appendChild(opt);
    });
    filter.value = current;

    var formSelect = document.getElementById('f_status');
    formSelect.innerHTML = '';
    allStatuses.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      formSelect.appendChild(opt);
    });
  }

  /* ---------- table rendering ---------- */

  function filteredLeads() {
    var search = document.getElementById('searchInput').value.trim().toLowerCase();
    var statusFilter = document.getElementById('statusFilter').value;
    var sectorFilter = document.getElementById('sectorFilter').value;

    return allLeads.filter(function (lead) {
      var matchesStatus = !statusFilter || lead.status === statusFilter;
      var matchesSector = !sectorFilter || lead.sector === sectorFilter;
      var haystack = [lead.company, lead.contactName, lead.phone, lead.email, lead.notes]
        .join(' ').toLowerCase();
      var matchesSearch = !search || haystack.indexOf(search) !== -1;
      return matchesStatus && matchesSector && matchesSearch;
    });
  }

  function sectorTagHtml(sectorKey) {
    var s = sectorByKey(sectorKey);
    if (!s) return '';
    return '<span class="sector-tag ' + s.color + '"><span class="sector-dot"></span>' + escapeHtml(s.label) + '</span>';
  }

  /* ---------- export to excel ---------- */

  function onExportExcel() {
    // מייצא בדיוק את מה שמסונן על המסך כרגע (חיפוש/סטטוס/סקטור).
    var leads = filteredLeads();
    var headers = ['סקטור', 'מקור', 'שם חברה', 'ח.פ', 'איש קשר', 'תפקיד', 'נייד', 'אימייל', 'הערות', 'סטטוס', 'תשובת וואטסאפ', 'תאריך תשובה', 'תאריך יצירה'];
    var rows = leads.map(function (lead) {
      var s = sectorByKey(lead.sector);
      return [
        s ? s.label : '', lead.source || '', lead.company || '', lead.companyId || '', lead.contactName || '',
        lead.role || '', lead.phone || '', lead.email || '', lead.notes || '',
        lead.status || '', lead.replyText || '', lead.replyAt || '', lead.createdAt || ''
      ];
    });

    var btn = document.getElementById('exportExcelBtn');
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'מייצא...';

    google.script.run
      .withSuccessHandler(function (base64) {
        btn.disabled = false;
        btn.textContent = originalLabel;
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'לידים - IBM BOB.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = originalLabel;
        showToast(err.message || 'שגיאה בייצוא לאקסל', true);
      })
      .exportLeadsExcel(headers, rows);
  }

  function renderTable() {
    var filtered = filteredLeads();
    var body = document.getElementById('leadsTableBody');
    body.innerHTML = '';

    document.getElementById('leadCount').textContent = filtered.length + ' לידים';

    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="13" class="empty-row">אין לידים להצגה</td></tr>';
      updateSelectionUi();
      return;
    }

    filtered.forEach(function (lead) {
      var tr = document.createElement('tr');
      if (selectedIds.has(lead.id)) tr.classList.add('selected');
      var checked = selectedIds.has(lead.id) ? 'checked' : '';
      tr.innerHTML =
        '<td><input type="checkbox" class="row-check" data-id="' + lead.id + '" ' + checked + '></td>' +
        '<td>' + sectorTagHtml(lead.sector) + '</td>' +
        '<td>' + escapeHtml(lead.source) + '</td>' +
        '<td>' + escapeHtml(lead.company) + '</td>' +
        '<td>' + escapeHtml(lead.companyId) + '</td>' +
        '<td>' + escapeHtml(lead.contactName) + '</td>' +
        '<td>' + escapeHtml(lead.role) + '</td>' +
        '<td>' + escapeHtml(lead.phone) + '</td>' +
        '<td>' + escapeHtml(lead.email) + '</td>' +
        '<td>' + escapeHtml(lead.notes) + '</td>' +
        '<td><span class="badge" style="background:' + colorForStatus(lead.status) + '">' + escapeHtml(lead.status) + '</span></td>' +
        '<td><div class="reply-cell"><span class="reply-text">' + escapeHtml(lead.replyText) + '</span>' +
          (lead.replyAt ? '<span class="reply-date">' + escapeHtml(lead.replyAt) + '</span>' : '') +
          '</div></td>' +
        '<td><button type="button" class="row-edit">✎</button></td>';

      tr.querySelector('.row-check').addEventListener('click', function (evt) { evt.stopPropagation(); });
      tr.querySelector('.row-check').addEventListener('change', function (evt) {
        toggleSelect(lead.id, evt.target.checked);
      });
      tr.addEventListener('click', function () { openEditModal(lead); });
      body.appendChild(tr);
    });

    updateSelectionUi();
  }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    updateSelectionUi();
  }

  function onSelectAll(evt) {
    var checked = evt.target.checked;
    filteredLeads().forEach(function (lead) {
      if (checked) selectedIds.add(lead.id); else selectedIds.delete(lead.id);
    });
    renderTable();
  }

  function updateSelectionUi() {
    document.getElementById('selCount').textContent = selectedIds.size;
    document.getElementById('waBtn').disabled = selectedIds.size === 0;
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- lead modal ---------- */

  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'הוספת ליד חדש';
    document.getElementById('leadForm').reset();
    document.getElementById('leadId').value = '';
    document.getElementById('deleteLeadBtn').classList.add('hidden');
    if (allStatuses.length) document.getElementById('f_status').value = allStatuses[0];
    document.getElementById('leadOverlay').classList.remove('hidden');
  }

  function openEditModal(lead) {
    document.getElementById('modalTitle').textContent = 'עריכת ליד';
    document.getElementById('leadId').value = lead.id;
    document.getElementById('f_sector').value = lead.sector || '';
    document.getElementById('f_source').value = lead.source || '';
    document.getElementById('f_company').value = lead.company || '';
    document.getElementById('f_companyId').value = lead.companyId || '';
    document.getElementById('f_contactName').value = lead.contactName || '';
    document.getElementById('f_role').value = lead.role || '';
    document.getElementById('f_phone').value = lead.phone || '';
    document.getElementById('f_email').value = lead.email || '';
    document.getElementById('f_notes').value = lead.notes || '';
    document.getElementById('f_status').value = lead.status || '';
    document.getElementById('deleteLeadBtn').classList.remove('hidden');
    document.getElementById('leadOverlay').classList.remove('hidden');
  }

  function closeLeadModal() {
    document.getElementById('leadOverlay').classList.add('hidden');
  }

  function onSubmitLead(evt) {
    evt.preventDefault();
    var id = document.getElementById('leadId').value;
    var data = {
      sector: document.getElementById('f_sector').value,
      source: document.getElementById('f_source').value.trim(),
      company: document.getElementById('f_company').value.trim(),
      companyId: document.getElementById('f_companyId').value.trim(),
      contactName: document.getElementById('f_contactName').value.trim(),
      role: document.getElementById('f_role').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
      status: document.getElementById('f_status').value
    };

    var submitBtn = evt.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    var onDone = function () {
      submitBtn.disabled = false;
      closeLeadModal();
      loadLeads();
      showToast('הליד נשמר בהצלחה');
    };
    var onFail = function (err) {
      submitBtn.disabled = false;
      showError(err);
    };

    if (id) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateLead(id, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).addLead(data);
    }
  }

  function onDeleteLead() {
    var id = document.getElementById('leadId').value;
    if (!id) return;
    if (!confirm('למחוק את הליד הזה?')) return;
    google.script.run.withSuccessHandler(function () {
      closeLeadModal();
      selectedIds.delete(id);
      loadLeads();
      showToast('הליד נמחק');
    }).withFailureHandler(showError).deleteLead(id);
  }

  /* ---------- whatsapp modal (מהטבלה הראשית - כל התבניות) ---------- */

  function openWaModal() {
    var list = document.getElementById('recipientsList');
    var ids = [...selectedIds];
    var names = allLeads.filter(function (l) { return ids.indexOf(l.id) !== -1; })
      .map(function (l) { return l.contactName || l.company || l.phone; });
    list.innerHTML = names.map(function (n) { return '<span>' + escapeHtml(n) + '</span>'; }).join('');

    renderTemplateChoice(document.getElementById('templateChoice'), allTemplates);

    document.getElementById('waMsg').textContent = '';
    document.getElementById('waOverlay').classList.remove('hidden');
  }

  function closeWaModal() {
    document.getElementById('waOverlay').classList.add('hidden');
  }

  function renderTemplateChoice(container, templates) {
    container.innerHTML = '';
    if (!templates.length) {
      container.innerHTML = '<div class="admin-msg">אין תבניות מוגדרות לבחירה</div>';
      return;
    }
    templates.forEach(function (t, i) {
      var label = document.createElement('label');
      label.className = 'tpl-option' + (i === 0 ? ' checked' : '');
      label.innerHTML = '<input type="radio" name="' + container.id + 'Radio" value="' + escapeHtml(t.templateId) + '" ' + (i === 0 ? 'checked' : '') + '> ' + escapeHtml(t.name);
      label.querySelector('input').addEventListener('change', function () {
        container.querySelectorAll('.tpl-option').forEach(function (el) { el.classList.remove('checked'); });
        label.classList.add('checked');
      });
      container.appendChild(label);
    });
  }

  function onSendWhatsApp() {
    var selected = document.querySelector('input[name="templateChoiceRadio"]:checked');
    var msg = document.getElementById('waMsg');
    if (!selected) { msg.textContent = 'יש לבחור תבנית'; return; }

    var sendBtn = document.getElementById('sendWaBtn');
    sendBtn.disabled = true;
    msg.style.color = '';
    msg.textContent = 'שולח...';

    google.script.run
      .withSuccessHandler(function (result) {
        sendBtn.disabled = false;
        closeWaModal();
        selectedIds.clear();
        loadLeads();
        showToast('נשלח ל-' + result.sent + ' נמענים' + (result.skipped.length ? (', דילוג על ' + result.skipped.length + ' ללא טלפון') : ''));
      })
      .withFailureHandler(function (err) {
        sendBtn.disabled = false;
        msg.style.color = '#a3312a';
        msg.textContent = err.message || 'שגיאה בשליחה';
      })
      .sendWhatsApp([...selectedIds], selected.value);
  }

  /* ---------- מודאל סקטור (נפתח מהבאנר) ---------- */

  function openSectorModal(key) {
    var s = sectorByKey(key);
    if (!s) return;
    currentSectorKey = key;
    sectorSelectedIds = new Set();

    var head = document.getElementById('sectorHead');
    head.className = 'sector-modal-head ' + s.color;
    document.getElementById('sectorTitle').textContent = s.icon + ' ' + s.label + ' — IBM BOB';
    document.getElementById('sectorSub').textContent = s.date ? formatSectorDate_(s.date) : 'התאריך עוד לא נקבע';

    if (sectorCountdownTimer) clearInterval(sectorCountdownTimer);
    var cdBlock = document.getElementById('sectorCountdown');
    if (s.date) {
      cdBlock.classList.remove('hidden');
      startSectorCountdown_(s.date);
    } else {
      cdBlock.classList.add('hidden');
    }

    renderSectorTable();
    renderTemplateChoice(document.getElementById('sectorTemplates'), allTemplates.filter(function (t) {
      return !t.sector || t.sector === key;
    }));
    document.getElementById('sectorSelectAll').checked = false;
    document.getElementById('sectorWaMsg').textContent = '';
    updateSectorSelectionUi();

    document.getElementById('sectorOverlay').classList.remove('hidden');
  }

  function formatSectorDate_(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {
      return iso;
    }
  }

  function startSectorCountdown_(targetIso) {
    function tick() {
      var target = new Date(targetIso).getTime();
      var diff = Math.max(0, target - Date.now());
      document.getElementById('secCdDays').textContent = Math.floor(diff / 86400000);
      document.getElementById('secCdHours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
      document.getElementById('secCdMins').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    }
    tick();
    sectorCountdownTimer = setInterval(tick, 30000);
  }

  function closeSectorModal() {
    document.getElementById('sectorOverlay').classList.add('hidden');
    if (sectorCountdownTimer) { clearInterval(sectorCountdownTimer); sectorCountdownTimer = null; }
  }

  function sectorLeads_() {
    return allLeads.filter(function (l) { return l.sector === currentSectorKey; });
  }

  function renderSectorTable() {
    var body = document.getElementById('sectorTableBody');
    var leads = sectorLeads_();
    if (!leads.length) {
      body.innerHTML = '<tr><td colspan="5" class="empty-row">אין לידים בסקטור זה עדיין</td></tr>';
      return;
    }
    body.innerHTML = leads.map(function (l) {
      var checked = sectorSelectedIds.has(l.id) ? 'checked' : '';
      return '<tr>' +
        '<td><input type="checkbox" class="sector-row-check" data-id="' + l.id + '" ' + checked + '></td>' +
        '<td>' + escapeHtml(l.company) + '</td>' +
        '<td>' + escapeHtml(l.contactName) + '</td>' +
        '<td>' + escapeHtml(l.phone) + '</td>' +
        '<td><span class="badge" style="background:' + colorForStatus(l.status) + '">' + escapeHtml(l.status) + '</span></td>' +
        '</tr>';
    }).join('');
    body.querySelectorAll('.sector-row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        if (cb.checked) sectorSelectedIds.add(cb.dataset.id); else sectorSelectedIds.delete(cb.dataset.id);
        updateSectorSelectionUi();
      });
    });
  }

  function onSectorSelectAll(evt) {
    var checked = evt.target.checked;
    sectorLeads_().forEach(function (l) {
      if (checked) sectorSelectedIds.add(l.id); else sectorSelectedIds.delete(l.id);
    });
    renderSectorTable();
    updateSectorSelectionUi();
  }

  function updateSectorSelectionUi() {
    document.getElementById('sectorSelCount').textContent = sectorSelectedIds.size;
    document.getElementById('sectorWaBtn').disabled = sectorSelectedIds.size === 0;
  }

  function onSectorInfoClick() {
    var s = sectorByKey(currentSectorKey);
    if (s && s.infoUrl) window.open(s.infoUrl, '_blank');
    else showToast('דף המידע לסקטור הזה עדיין לא חובר', true);
  }

  function onSendSectorWhatsApp() {
    var selected = document.querySelector('input[name="sectorTemplatesRadio"]:checked');
    var msg = document.getElementById('sectorWaMsg');
    if (!selected) { msg.textContent = 'יש לבחור תבנית'; return; }

    var btn = document.getElementById('sectorWaBtn');
    btn.disabled = true;
    msg.style.color = '';
    msg.textContent = 'שולח...';

    google.script.run
      .withSuccessHandler(function (result) {
        msg.textContent = '';
        loadLeads();
        renderSectorTable();
        sectorSelectedIds.clear();
        updateSectorSelectionUi();
        showToast('נשלח ל-' + result.sent + ' נמענים' + (result.skipped.length ? (', דילוג על ' + result.skipped.length + ' ללא טלפון') : ''));
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        msg.style.color = '#a3312a';
        msg.textContent = err.message || 'שגיאה בשליחה';
      })
      .sendWhatsApp([...sectorSelectedIds], selected.value);
  }

  /* ---------- ui helpers ---------- */

  function showToast(text, isError) {
    var toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'toast' + (isError ? ' error' : '');
    setTimeout(function () { toast.classList.add('hidden'); }, 3000);
  }

  function showError(err) {
    showToast(err.message || 'אירעה שגיאה', true);
  }
</script>
